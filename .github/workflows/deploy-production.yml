name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: digital-garden-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Run test suite
        run: npm test

      - name: Configure SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          PORT="${PROD_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static site
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          DEPLOY_PORT: ${{ secrets.PROD_PORT }}
          DEPLOY_TARGET_DIR: /var/www/html/seed
          DEPLOY_TMP_DIR: ~/digital_garden_tmp
        run: ./scripts/deploy_prod.sh

      - name: Verify site
        run: curl -fsSL https://rrzxs.com/seed/index.html >/dev/null
