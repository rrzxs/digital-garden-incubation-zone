<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Audio Visualizer — 数字花园</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回集木区</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
    </div>

    <main class="app-container">
        <header class="panel-header">
            <h1 class="brand-title">Fluid Audio<span class="accent">.</span></h1>
            <p class="brand-subtitle">Where sound becomes visible geometry.</p>
        </header>

        <section class="viz-area">
            <div class="viz-glass">
                <canvas id="vizCanvas"></canvas>
                <div class="viz-overlay" id="vizOverlay">
                    <div class="start-ring" id="startRing">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </div>
                    <p class="hint-text" id="hintText">点击启动麦克风</p>
                </div>
            </div>
        </section>

        <section class="controls-bar">
            <div class="mode-group">
                <button class="mode-btn active" data-mode="bars" title="频谱柱">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="13" width="3" height="8"/><rect x="7" y="8" width="3" height="13"/><rect x="12" y="3" width="3" height="18"/><rect x="17" y="8" width="3" height="13"/></svg>
                </button>
                <button class="mode-btn" data-mode="wave" title="波形线">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></svg>
                </button>
                <button class="mode-btn" data-mode="radial" title="径向谱">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                </button>
                <button class="mode-btn" data-mode="particles" title="粒子场">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="1.5"/><circle cx="19" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/><circle cx="19" cy="18" r="1.5"/></svg>
                </button>
            </div>

            <div class="palette-group" id="paletteGroup">
                <button class="palette-btn active" data-palette="aurora" aria-label="极光">
                    <span class="dot" style="background: linear-gradient(135deg, #667eea, #764ba2)"></span>
                </button>
                <button class="palette-btn" data-palette="ember" aria-label="余烬">
                    <span class="dot" style="background: linear-gradient(135deg, #f97316, #ef4444)"></span>
                </button>
                <button class="palette-btn" data-palette="ocean" aria-label="深海">
                    <span class="dot" style="background: linear-gradient(135deg, #06b6d4, #3b82f6)"></span>
                </button>
                <button class="palette-btn" data-palette="neon" aria-label="霓虹">
                    <span class="dot" style="background: linear-gradient(135deg, #22d3ee, #a3e635)"></span>
                </button>
            </div>

            <div class="action-group">
                <button class="icon-btn" id="demoBtn" title="演示音源">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                    </svg>
                </button>
                <button class="icon-btn" id="fullscreenBtn" title="全屏">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
                    </svg>
                </button>
            </div>
        </section>

        <section class="stats-bar">
            <div class="stat-chip">
                <span class="stat-label">BASS</span>
                <span class="stat-value" id="statBass">0</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">MID</span>
                <span class="stat-value" id="statMid">0</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">HIGH</span>
                <span class="stat-value" id="statHigh">0</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">FPS</span>
                <span class="stat-value" id="statFps">60</span>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
