<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch - 故障艺术文字</title>
    <meta name="description" content="赛博朋克风格的故障艺术文字效果生成器，支持多种故障模式与高阶微交互">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0f'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' fill='%2300ffff'%3EG%3C/text%3E%3Ctext x='34' y='44' text-anchor='middle' font-size='32' fill='%23ff00ff'%3EG%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="scanlines"></div>
        <div class="noise-overlay"></div>
    </div>

    <div class="app-container">
        <header class="header glass-panel">
            <div class="header-left">
                <span class="logo-icon">⌁</span>
                <h1 class="logo-text">GLITCH</h1>
            </div>
            <div class="header-right">
                <span class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">SYSTEM ONLINE</span>
                </span>
            </div>
        </header>

        <main class="main-content">
            <section class="display-section">
                <div class="glitch-container glass-panel" id="glitch-container">
                    <div class="glitch-display" id="glitch-display">
                        <span class="glitch-text" data-text="GLITCH">GLITCH</span>
                    </div>
                    <div class="glitch-meta">
                        <span class="meta-item">MODE: <span id="current-mode">RGB_SPLIT</span></span>
                        <span class="meta-item">FPS: <span id="fps-counter">60</span></span>
                    </div>
                </div>
            </section>

            <section class="controls-section glass-panel">
                <div class="control-group">
                    <label class="control-label">INPUT TEXT</label>
                    <div class="input-wrapper">
                        <input type="text" id="text-input" class="cyber-input" value="GLITCH" maxlength="20" placeholder="Enter text...">
                        <span class="input-glitch"></span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">GLITCH MODE</label>
                    <div class="mode-selector" id="mode-selector">
                        <button class="mode-btn active" data-mode="rgb-split">RGB_SPLIT</button>
                        <button class="mode-btn" data-mode="slice">SLICE</button>
                        <button class="mode-btn" data-mode="noise">NOISE</button>
                        <button class="mode-btn" data-mode="wave">WAVE</button>
                        <button class="mode-btn" data-mode="corrupt">CORRUPT</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">INTENSITY</label>
                    <div class="slider-wrapper">
                        <input type="range" id="intensity-slider" class="cyber-slider" min="1" max="100" value="50">
                        <span class="slider-value" id="intensity-value">50</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">SPEED</label>
                    <div class="slider-wrapper">
                        <input type="range" id="speed-slider" class="cyber-slider" min="1" max="100" value="70">
                        <span class="slider-value" id="speed-value">70</span>
                    </div>
                </div>

                <div class="control-actions">
                    <button class="action-btn" id="randomize-btn">
                        <span class="btn-icon">⏣</span>
                        <span class="btn-text">RANDOMIZE</span>
                    </button>
                    <button class="action-btn primary" id="trigger-btn">
                        <span class="btn-icon">⌁</span>
                        <span class="btn-text">TRIGGER GLITCH</span>
                    </button>
                </div>
            </section>

            <section class="info-section">
                <div class="info-card glass-panel">
                    <div class="info-icon">⟁</div>
                    <div class="info-content">
                        <h3>INTERACTION</h3>
                        <p>Hover the display area to disturb. Click TRIGGER for burst effect.</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <span class="footer-text">GLITCH v1.0 | Maintainer: EDEN</span>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
