<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Terrarium - 习惯生态瓶</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Outfit:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <main class="app-shell">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">Habit Terrarium</h1>
                <p class="app-subtitle" id="date-display"></p>
            </div>
            <div class="header-right">
                <div class="streak-badge" id="streak-badge">
                    <span class="streak-flame">&#x2728;</span>
                    <span class="streak-count" id="streak-count">0</span>
                    <span class="streak-label">天连续</span>
                </div>
            </div>
        </header>

        <section class="terrarium-viewport">
            <div class="terrarium-glass" id="terrarium">
                <div class="terrarium-inner">
                    <div class="terrarium-ground">
                        <svg class="ground-svg" viewBox="0 0 400 60" preserveAspectRatio="none">
                            <path d="M0,30 Q50,10 100,25 T200,20 T300,28 T400,22 L400,60 L0,60 Z" fill="var(--ground-fill)" opacity="0.6"/>
                            <path d="M0,38 Q60,22 120,35 T240,30 T360,36 T400,32 L400,60 L0,60 Z" fill="var(--ground-fill)" opacity="0.8"/>
                            <path d="M0,45 Q80,35 160,42 T320,40 T400,44 L400,60 L0,60 Z" fill="var(--ground-deep)"/>
                        </svg>
                    </div>
                    <div class="plant-layer" id="plant-layer"></div>
                    <div class="mist-layer" id="mist-layer"></div>
                    <div class="condensation" id="condensation"></div>
                    <div class="glass-reflection"></div>
                </div>
                <div class="terrarium-rim"></div>
            </div>
            <div class="terrarium-base">
                <div class="base-glow"></div>
            </div>
        </section>

        <section class="habits-panel glass-panel">
            <div class="panel-header">
                <h2 class="panel-title">今日照料</h2>
                <button class="add-btn" id="add-habit-btn" aria-label="添加习惯">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="habits-list" id="habits-list">
                <div class="empty-habits" id="empty-habits">
                    <div class="empty-icon">&#x1F331;</div>
                    <p>添加你的第一个习惯<br><span class="empty-hint">每个习惯都是一颗等待生长的种子</span></p>
                </div>
            </div>
        </section>

        <div class="modal-overlay" id="modal-overlay">
            <div class="modal glass-panel" id="add-modal">
                <h3 class="modal-title">种下一颗新种子</h3>
                <div class="form-group">
                    <label class="form-label">习惯名称</label>
                    <input type="text" class="form-input" id="habit-name-input" placeholder="例如: 晨间冥想" maxlength="20" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label">选择植物类型</label>
                    <div class="plant-selector" id="plant-selector">
                        <button class="plant-option active" data-type="succulent" title="多肉">
                            <svg viewBox="0 0 40 40" width="40" height="40"><ellipse cx="20" cy="26" rx="8" ry="10" fill="#4ade80" opacity="0.8"/><ellipse cx="12" cy="24" rx="6" ry="8" fill="#22c55e" opacity="0.7" transform="rotate(-20 12 24)"/><ellipse cx="28" cy="24" rx="6" ry="8" fill="#22c55e" opacity="0.7" transform="rotate(20 28 24)"/><ellipse cx="20" cy="18" rx="5" ry="7" fill="#86efac" opacity="0.6" transform="rotate(5 20 18)"/></svg>
                            <span>多肉</span>
                        </button>
                        <button class="plant-option" data-type="fern" title="蕨类">
                            <svg viewBox="0 0 40 40" width="40" height="40"><path d="M20,36 Q18,28 14,22 Q10,16 16,12 Q20,8 20,4" stroke="#4ade80" fill="none" stroke-width="2"/><path d="M14,22 Q10,18 6,20" stroke="#22c55e" fill="none" stroke-width="1.5"/><path d="M16,16 Q12,12 8,14" stroke="#22c55e" fill="none" stroke-width="1.5"/><path d="M24,28 Q28,22 32,24" stroke="#22c55e" fill="none" stroke-width="1.5"/><path d="M22,20 Q26,16 30,18" stroke="#22c55e" fill="none" stroke-width="1.5"/></svg>
                            <span>蕨类</span>
                        </button>
                        <button class="plant-option" data-type="flower" title="花卉">
                            <svg viewBox="0 0 40 40" width="40" height="40"><line x1="20" y1="36" x2="20" y2="16" stroke="#22c55e" stroke-width="2"/><circle cx="20" cy="13" r="4" fill="#f472b6" opacity="0.8"/><circle cx="16" cy="16" r="3.5" fill="#fb923c" opacity="0.7"/><circle cx="24" cy="16" r="3.5" fill="#a78bfa" opacity="0.7"/><circle cx="17" cy="11" r="3" fill="#fbbf24" opacity="0.6"/><circle cx="23" cy="11" r="3" fill="#60a5fa" opacity="0.6"/></svg>
                            <span>花卉</span>
                        </button>
                        <button class="plant-option" data-type="cactus" title="仙人掌">
                            <svg viewBox="0 0 40 40" width="40" height="40"><rect x="16" y="10" width="8" height="26" rx="4" fill="#4ade80" opacity="0.8"/><path d="M16,22 Q10,22 10,16 Q10,12 14,14" stroke="#22c55e" fill="none" stroke-width="3" stroke-linecap="round"/><path d="M24,20 Q30,20 30,14 Q30,10 26,12" stroke="#22c55e" fill="none" stroke-width="3" stroke-linecap="round"/></svg>
                            <span>仙人掌</span>
                        </button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-ghost" id="modal-cancel">取消</button>
                    <button class="btn btn-primary" id="modal-confirm">播种</button>
                </div>
            </div>
        </div>

        <div class="toast-container" id="toast-container"></div>
    </main>

    <script src="main.js"></script>
</body>
</html>
