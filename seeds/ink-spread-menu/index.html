<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Spread Menu - 墨韵展开菜单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas id="ink-canvas"></canvas>

    <div class="cursor-glow" id="cursor-glow"></div>

    <main class="app-shell" id="app-shell">
        <nav class="top-nav" id="top-nav">
            <div class="nav-brand">
                <span class="nav-icon">墨</span>
                <div class="nav-text">
                    <h1 class="nav-title">Ink Spread Menu</h1>
                    <span class="nav-subtitle">墨韵展开导航</span>
                </div>
            </div>
            <div class="nav-controls">
                <div class="theme-toggle" id="theme-toggle">
                    <button class="theme-btn active" data-theme="ink-dark" aria-label="墨夜">墨夜</button>
                    <button class="theme-btn" data-theme="ink-moon" aria-label="月墨">月墨</button>
                    <button class="theme-btn" data-theme="ink-crimson" aria-label="朱砂">朱砂</button>
                    <button class="theme-btn" data-theme="ink-void" aria-label="虚空">虚空</button>
                </div>
                <button class="icon-btn" id="btn-fullscreen" aria-label="全屏">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                </button>
            </div>
        </nav>

        <div class="ink-stage" id="ink-stage">
            <div class="stage-hint" id="stage-hint">
                <span class="hint-icon">+</span>
                <span class="hint-text">点击任意位置展开墨韵菜单</span>
            </div>
        </div>

        <footer class="app-footer">
            <div class="footer-hint">
                <span class="hint-key">Click</span>
                <span class="hint-sep">·</span>
                <span class="hint-key">Drag</span>
                <span class="hint-sep">·</span>
                <span class="hint-key">Hover</span>
                <span class="hint-label">墨韵交互</span>
            </div>
            <div class="footer-meta">
                <span class="meta-chip" id="fps-counter">60 FPS</span>
                <span class="meta-chip" id="ripple-count">0 涟漪</span>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
