<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Play 涂鸦游乐场</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="aurora">
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <main class="app-shell">
        <header class="panel-header glass">
            <div class="brand-group">
                <h1 class="brand-title">Doodle<span class="brand-dot">.</span>Play</h1>
                <p class="brand-subtitle">涂鸦游乐场 · 指尖即兴</p>
            </div>
            <div class="header-actions">
                <div class="theme-dots" id="theme-dots" role="group" aria-label="氛围配色">
                    <button class="theme-dot" data-theme="aurora" title="极光"></button>
                    <button class="theme-dot" data-theme="sunset" title="暮霞"></button>
                    <button class="theme-dot" data-theme="ocean" title="深海"></button>
                    <button class="theme-dot" data-theme="mono" title="墨色"></button>
                </div>
                <span class="stroke-counter" id="stroke-counter">0 strokes</span>
            </div>
        </header>

        <section class="canvas-stage glass" id="canvas-stage">
            <canvas id="doodle-canvas"></canvas>
            <canvas id="fx-canvas"></canvas>
            <div class="stage-hint" id="stage-hint">
                <span class="hint-glyph">✎</span>
                <span class="hint-text">在此落笔，随手涂鸦</span>
            </div>
            <div class="live-cursor" id="live-cursor"></div>
        </section>

        <footer class="panel-toolbar glass">
            <div class="tool-group brush-group" id="brush-group">
                <button class="tool-btn active" data-brush="ink" title="墨韵">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                    <span>墨韵</span>
                </button>
                <button class="tool-btn" data-brush="neon" title="霓虹">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
                    <span>霓虹</span>
                </button>
                <button class="tool-btn" data-brush="rainbow" title="流彩">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12a10 10 0 0 1 20 0"/><path d="M6 12a6 6 0 0 1 12 0"/><path d="M10 12a2 2 0 0 1 4 0"/></svg>
                    <span>流彩</span>
                </button>
                <button class="tool-btn" data-brush="particle" title="星屑">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
                    <span>星屑</span>
                </button>
                <button class="tool-btn" data-brush="ribbon" title="缎带">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12c3-6 5 6 8 0s5 6 8 0"/></svg>
                    <span>缎带</span>
                </button>
            </div>

            <div class="tool-group palette-group" id="palette-group">
                <button class="swatch active" data-color="auto" title="自动（随主题流动）"></button>
                <button class="swatch" data-color="#f43f5e"></button>
                <button class="swatch" data-color="#f59e0b"></button>
                <button class="swatch" data-color="#10b981"></button>
                <button class="swatch" data-color="#3b82f6"></button>
                <button class="swatch" data-color="#a855f7"></button>
                <button class="swatch" data-color="#ffffff"></button>
            </div>

            <div class="tool-group slider-group">
                <span class="slider-label">SIZE</span>
                <input type="range" id="size-slider" class="size-slider" min="2" max="42" value="10" />
                <span class="slider-value" id="size-value">10</span>
            </div>

            <div class="tool-group action-group">
                <button class="action-btn" id="btn-undo" title="撤销 (Z)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
                </button>
                <button class="action-btn" id="btn-replay" title="回放笔迹 (R)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="action-btn" id="btn-clear" title="清空 (C)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                </button>
                <button class="action-btn primary" id="btn-save" title="导出 PNG (S)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
