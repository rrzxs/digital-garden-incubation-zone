<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Grid Scene — 点阵场景</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="palette-aurora">
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas id="dot-canvas"></canvas>

    <div class="cursor-orb" id="cursor-orb">
        <div class="orb-core"></div>
        <div class="orb-ring"></div>
        <div class="orb-aura"></div>
    </div>

    <div class="crosshair-h" id="crosshair-h"></div>
    <div class="crosshair-v" id="crosshair-v"></div>

    <header class="app-header">
        <div class="brand-group">
            <h1 class="brand-title">Dot<span class="brand-dot">·</span>Grid<span class="brand-accent">Scene</span></h1>
            <p class="brand-subtitle">点阵场景 — 弹簧物理驱动的非线性力场微交互</p>
        </div>
    </header>

    <aside class="info-panel glass-panel" id="info-panel">
        <div class="info-header">
            <span class="info-title">FIELD TELEMETRY</span>
            <span class="info-pulse" id="info-pulse"></span>
        </div>
        <div class="info-section">
            <div class="info-row">
                <span class="info-label">CX</span>
                <span class="info-value mono" id="info-cx">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">CY</span>
                <span class="info-value mono" id="info-cy">0</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="info-label">VEL</span>
                <span class="info-value mono" id="info-vel">0.00</span>
            </div>
            <div class="info-row">
                <span class="info-label">DIST</span>
                <span class="info-value mono" id="info-dist">0</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="info-label">NODES</span>
                <span class="info-value mono" id="info-nodes">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">ACTIVE</span>
                <span class="info-value mono" id="info-active">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">RIPPLES</span>
                <span class="info-value mono" id="info-ripples">0</span>
            </div>
        </div>
    </aside>

    <div class="hint-toast glass-panel" id="hint-toast">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>移动光标扰动点阵 · 点击释放冲击波</span>
    </div>

    <footer class="controls-bar glass-panel" id="controls-bar">
        <div class="control-group">
            <label class="control-label">网格密度</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-density" min="24" max="80" value="40" class="slider">
                <span class="slider-val" id="val-density">40</span>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">力场半径</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-radius" min="80" max="340" value="180" class="slider">
                <span class="slider-val" id="val-radius">180</span>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">场强</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-strength" min="10" max="100" value="60" class="slider">
                <span class="slider-val" id="val-strength">0.60</span>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">弹性</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-damping" min="20" max="95" value="82" class="slider">
                <span class="slider-val" id="val-damping">0.82</span>
            </div>
        </div>

        <div class="mode-group">
            <button class="mode-btn active" data-mode="repel" aria-label="排斥">排斥</button>
            <button class="mode-btn" data-mode="attract" aria-label="吸引">吸引</button>
            <button class="mode-btn" data-mode="vortex" aria-label="漩涡">漩涡</button>
            <button class="mode-btn" data-mode="wave" aria-label="波场">波场</button>
        </div>

        <div class="palette-group">
            <button class="palette-btn active" data-palette="aurora" aria-label="极光">
                <span class="swatch" style="background:linear-gradient(135deg,#22d3ee,#818cf8,#e879f9)"></span>
            </button>
            <button class="palette-btn" data-palette="ember" aria-label="余烬">
                <span class="swatch" style="background:linear-gradient(135deg,#fb923c,#f43f5e,#fbbf24)"></span>
            </button>
            <button class="palette-btn" data-palette="moss" aria-label="苔藓">
                <span class="swatch" style="background:linear-gradient(135deg,#34d399,#a3e635,#22d3ee)"></span>
            </button>
            <button class="palette-btn" data-palette="dusk" aria-label="暮色">
                <span class="swatch" style="background:linear-gradient(135deg,#f472b6,#c084fc,#60a5fa)"></span>
            </button>
        </div>

        <div class="action-group">
            <button class="action-btn" id="btn-burst">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>脉冲</span>
            </button>
            <button class="action-btn primary" id="btn-fullscreen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                <span>全屏</span>
            </button>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
