<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glyph Field — 字形力场</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <main class="app-shell">
        <header class="panel-header">
            <div class="brand-group">
                <h1 class="brand-title">Glyph<span class="brand-dot">.</span>Field</h1>
                <p class="brand-subtitle">字形力场 — 字符的非线性响应空间</p>
            </div>
            <div class="header-actions">
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="attract" aria-label="吸引模式">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="4 3"/></svg>
                    </button>
                    <button class="mode-btn" data-mode="repel" aria-label="排斥模式">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="2"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="8" y1="12" x2="2" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/></svg>
                    </button>
                    <button class="mode-btn" data-mode="vortex" aria-label="漩涡模式">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10"/><path d="M12 6c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <section class="field-area" id="field-area">
            <canvas id="field-canvas"></canvas>
            <div class="glyph-grid" id="glyph-grid"></div>

            <div class="field-hint" id="field-hint">
                <span class="hint-dot"></span>
                <span class="hint-text">移动鼠标 · 扰动字形力场</span>
            </div>
        </section>

        <footer class="controls-bar">
            <div class="control-group">
                <label class="control-label">力场强度</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-force" min="10" max="100" value="50" class="slider">
                    <span class="slider-val" id="val-force">0.50</span>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">弹性</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-spring" min="2" max="20" value="8" class="slider">
                    <span class="slider-val" id="val-spring">0.08</span>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">半径</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-radius" min="80" max="400" value="200" class="slider">
                    <span class="slider-val" id="val-radius">200</span>
                </div>
            </div>

            <div class="charset-group">
                <button class="charset-btn active" data-charset="kana" aria-label="假名">ア</button>
                <button class="charset-btn" data-charset="runes" aria-label="符文">ᚱ</button>
                <button class="charset-btn" data-charset="symbols" aria-label="符号">◈</button>
                <button class="charset-btn" data-charset="code" aria-label="代码">{}</button>
            </div>

            <div class="palette-group">
                <button class="palette-btn active" data-palette="void" aria-label="虚空">
                    <span class="swatch" style="background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899)"></span>
                </button>
                <button class="palette-btn" data-palette="jade" aria-label="翡翠">
                    <span class="swatch" style="background:linear-gradient(135deg,#10b981,#34d399,#6ee7b7)"></span>
                </button>
                <button class="palette-btn" data-palette="solar" aria-label="日蚀">
                    <span class="swatch" style="background:linear-gradient(135deg,#f59e0b,#ef4444,#f97316)"></span>
                </button>
                <button class="palette-btn" data-palette="arctic" aria-label="极地">
                    <span class="swatch" style="background:linear-gradient(135deg,#67e8f9,#a5b4fc,#e0e7ff)"></span>
                </button>
            </div>

            <div class="action-group">
                <button class="action-btn" id="btn-shuffle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                    <span>洗牌</span>
                </button>
                <button class="action-btn primary" id="btn-fullscreen">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    <span>全屏</span>
                </button>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
