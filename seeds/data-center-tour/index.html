<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Center Tour · 数据中心漫游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="abyss" data-floor="0">
  <!-- ====== 流体渐变背景层 ====== -->
  <div class="bg-layer" aria-hidden="true">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>
    <div class="blob blob--4"></div>
    <div class="grain"></div>
  </div>

  <!-- ====== 粒子流场画布 ====== -->
  <canvas class="flow-field" id="flowCanvas" aria-hidden="true"></canvas>

  <!-- ====== 顶部导航 ====== -->
  <header class="top-bar glass">
    <div class="top-bar__brand">
      <span class="brand-dot"></span>
      <span class="brand-name">DATA CENTER<br />TOUR · 漫游</span>
    </div>
    <nav class="top-bar__nav">
      <button class="nav-chip is-active" data-view="overview">总览</button>
      <button class="nav-chip" data-view="rack">机架</button>
      <button class="nav-chip" data-view="thermal">热力</button>
      <button class="nav-chip" data-view="network">网络</button>
    </nav>
    <div class="top-bar__themes">
      <button class="theme-dot is-active" data-theme="abyss" title="深渊"></button>
      <button class="theme-dot" data-theme="plasma" title="等离子"></button>
      <button class="theme-dot" data-theme="quantum" title="量子"></button>
      <button class="theme-dot" data-theme="solar" title="日冕"></button>
    </div>
  </header>

  <!-- ====== 主区域 ====== -->
  <main class="stage">
    <!-- 左侧：等距数据中心可视化 -->
    <section class="viewport glass" id="viewport">
      <div class="viewport__head">
        <div class="viewport__title">
          <span class="viewport__live" id="livePulse"></span>
          <h2 id="viewportTitle">ISOMETRIC HALL · A1</h2>
          <span class="viewport__sub" id="viewportSub">42 RACKS · 1,008 U · LIVE</span>
        </div>
        <div class="viewport__readout">
          <span class="readout-item"><b id="rdTemp">22.4</b><i>°C</i></span>
          <span class="readout-item"><b id="rdLoad">68</b><i>% LOAD</i></span>
          <span class="readout-item"><b id="rdPower">312</b><i>kW</i></span>
        </div>
      </div>

      <!-- 等距机架场 -->
      <div class="iso-scene" id="isoScene">
        <div class="iso-floor" id="isoFloor"></div>
        <!-- 机架由 JS 注入 -->
      </div>

      <div class="viewport__hud">
        <span class="hud-tag" id="hudView">VIEW · OVERVIEW</span>
        <span class="hud-tag" id="hudCoord">GRID 6×7</span>
        <span class="hud-tag" id="hudFps">— FPS</span>
      </div>
    </section>

    <!-- 右侧：选中机架详情 + 全局指标 -->
    <aside class="panel glass">
      <!-- 选中机架详情 -->
      <div class="panel__section rack-detail" id="rackDetail">
        <div class="rack-detail__head">
          <span class="rack-detail__id" id="rdRackId">RACK-A1-03</span>
          <span class="rack-detail__status" id="rdRackStatus">NOMINAL</span>
        </div>
        <h3 class="panel__h">SERVER UNITS</h3>
        <div class="unit-list" id="unitList">
          <!-- 由 JS 注入 -->
        </div>
      </div>

      <!-- 全局指标卡 -->
      <div class="panel__section">
        <h3 class="panel__h">FACILITY METRICS</h3>
        <div class="metric-grid">
          <div class="metric-card">
            <span class="metric-label">CPU</span>
            <div class="metric-bar"><div class="metric-fill" id="metricCpu"></div></div>
            <span class="metric-val" id="metricCpuVal">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">MEM</span>
            <div class="metric-bar"><div class="metric-fill" id="metricMem"></div></div>
            <span class="metric-val" id="metricMemVal">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">NET I/O</span>
            <div class="metric-bar"><div class="metric-fill" id="metricNet"></div></div>
            <span class="metric-val" id="metricNetVal">—</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">PUE</span>
            <div class="metric-bar"><div class="metric-fill" id="metricPue"></div></div>
            <span class="metric-val" id="metricPueVal">—</span>
          </div>
        </div>
      </div>

      <!-- 楼层切换 -->
      <div class="panel__section">
        <h3 class="panel__h">FLOOR LEVEL</h3>
        <div class="floor-tabs">
          <button class="floor-tab is-active" data-floor="0">B1 · 地下</button>
          <button class="floor-tab" data-floor="1">F1 · 一层</button>
          <button class="floor-tab" data-floor="2">F2 · 二层</button>
        </div>
      </div>

      <!-- 事件日志 -->
      <div class="panel__section">
        <h3 class="panel__h">EVENT LOG</h3>
        <div class="log-stream" id="logStream">
          <!-- 由 JS 注入 -->
        </div>
      </div>
    </aside>
  </main>

  <!-- ====== 底部状态条 ====== -->
  <footer class="bottom-bar glass">
    <div class="bottom-bar__group">
      <span class="status-led status-led--ok"></span>
      <span class="status-text">COOLING <b id="stCool">NOMINAL</b></span>
    </div>
    <div class="bottom-bar__group">
      <span class="status-led status-led--ok"></span>
      <span class="status-text">POWER GRID <b id="stPower">STABLE</b></span>
    </div>
    <div class="bottom-bar__group">
      <span class="status-led status-led--warn"></span>
      <span class="status-text">UPTIME <b id="stUptime">99.997%</b></span>
    </div>
    <div class="bottom-bar__group">
      <span class="status-text mono" id="stClock">00:00:00 UTC</span>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
