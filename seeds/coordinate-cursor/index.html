<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Cursor — 坐标光标</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas id="grid-canvas"></canvas>

    <div class="cursor-ring" id="cursor-ring">
        <div class="ring-inner"></div>
        <div class="ring-outer"></div>
        <div class="ring-pulse"></div>
    </div>

    <div class="coord-tooltip" id="coord-tooltip">
        <span class="coord-x" id="coord-x">X: 0</span>
        <span class="coord-sep">·</span>
        <span class="coord-y" id="coord-y">Y: 0</span>
    </div>

    <div class="crosshair-h" id="crosshair-h"></div>
    <div class="crosshair-v" id="crosshair-v"></div>

    <div class="trail-layer" id="trail-layer"></div>

    <header class="app-header">
        <div class="brand-group">
            <h1 class="brand-title">Coordinate<span class="brand-dot">.</span>Cursor</h1>
            <p class="brand-subtitle">坐标光标 — 非线性坐标空间体验</p>
        </div>
    </header>

    <aside class="info-panel glass-panel" id="info-panel">
        <div class="info-section">
            <div class="info-row">
                <span class="info-label">X</span>
                <span class="info-value mono" id="info-x">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">Y</span>
                <span class="info-value mono" id="info-y">0</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="info-label">VX</span>
                <span class="info-value mono" id="info-vx">0.00</span>
            </div>
            <div class="info-row">
                <span class="info-label">VY</span>
                <span class="info-value mono" id="info-vy">0.00</span>
            </div>
            <div class="info-row">
                <span class="info-label">SPD</span>
                <span class="info-value mono" id="info-speed">0.00</span>
            </div>
            <div class="info-row">
                <span class="info-label">ANG</span>
                <span class="info-value mono" id="info-angle">0.0°</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="info-label">TRAIL</span>
                <span class="info-value mono" id="info-trail">0</span>
            </div>
        </div>
    </aside>

    <footer class="controls-bar glass-panel" id="controls-bar">
        <div class="control-group">
            <label class="control-label">网格密度</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-density" min="20" max="120" value="60" class="slider">
                <span class="slider-val" id="val-density">60</span>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">力场半径</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-radius" min="60" max="300" value="150" class="slider">
                <span class="slider-val" id="val-radius">150</span>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">扭曲强度</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-warp" min="10" max="100" value="50" class="slider">
                <span class="slider-val" id="val-warp">0.50</span>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">轨迹长度</label>
            <div class="slider-wrap">
                <input type="range" id="ctrl-trail" min="5" max="80" value="30" class="slider">
                <span class="slider-val" id="val-trail">30</span>
            </div>
        </div>

        <div class="mode-group">
            <button class="mode-btn active" data-mode="warp" aria-label="扭曲">扭曲</button>
            <button class="mode-btn" data-mode="ripple" aria-label="涟漪">涟漪</button>
            <button class="mode-btn" data-mode="magnetic" aria-label="磁力">磁力</button>
        </div>

        <div class="palette-group">
            <button class="palette-btn active" data-palette="void" aria-label="虚空">
                <span class="swatch" style="background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899)"></span>
            </button>
            <button class="palette-btn" data-palette="jade" aria-label="翡翠">
                <span class="swatch" style="background:linear-gradient(135deg,#10b981,#34d399,#6ee7b7)"></span>
            </button>
            <button class="palette-btn" data-palette="solar" aria-label="日蚀">
                <span class="swatch" style="background:linear-gradient(135deg,#f59e0b,#ef4444,#f97316)"></span>
            </button>
            <button class="palette-btn" data-palette="arctic" aria-label="极地">
                <span class="swatch" style="background:linear-gradient(135deg,#67e8f9,#a5b4fc,#e0e7ff)"></span>
            </button>
        </div>

        <div class="action-group">
            <button class="action-btn" id="btn-snapshot">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span>截图</span>
            </button>
            <button class="action-btn primary" id="btn-fullscreen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                <span>全屏</span>
            </button>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
