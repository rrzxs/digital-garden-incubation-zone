<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typo Shift — 字形位移实验室</title>
    <meta name="description" content="沉浸式排版位移交互体验。输入文字，观察字间距、行高、字重、字号在流体曲线下实时形变">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a12'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='28' font-family='monospace' fill='%23c4b5fd'%3ETS%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <header class="panel-header">
            <div class="brand-group">
                <h1 class="brand-title">Typo<span class="brand-dot">.</span>Shift</h1>
                <p class="brand-subtitle">字形位移实验室 — 排版参数的流体形变空间</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-shuffle" aria-label="随机变形" title="随机变形">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="icon-btn" id="btn-reset" aria-label="重置参数" title="重置参数">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
            </div>
        </header>

        <section class="stage" id="stage">
            <div class="stage-inner" id="stage-inner">
                <div class="typo-canvas glass-panel" id="typo-canvas">
                    <div class="typo-display" id="typo-display"></div>
                </div>
                <div class="char-meta" id="char-meta"></div>
            </div>
        </section>

        <footer class="controls-bar glass-panel">
            <div class="controls-scroll">
                <div class="ctrl-group">
                    <label class="ctrl-label">输入文字</label>
                    <div class="text-input-wrap">
                        <input type="text" id="input-text" class="text-input" value="Typo Shift" maxlength="40" placeholder="输入任意文字...">
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字号 <span class="ctrl-value" id="val-size">72</span></label>
                    <input type="range" id="ctrl-size" class="range-input" min="24" max="160" value="72">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字重 <span class="ctrl-value" id="val-weight">400</span></label>
                    <input type="range" id="ctrl-weight" class="range-input" min="100" max="900" value="400" step="100">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字距 <span class="ctrl-value" id="val-spacing">0.00</span></label>
                    <input type="range" id="ctrl-spacing" class="range-input" min="-30" max="80" value="0">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">行高 <span class="ctrl-value" id="val-height">1.30</span></label>
                    <input type="range" id="ctrl-height" class="range-input" min="80" max="300" value="130">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">位移模式</label>
                    <div class="mode-toggle" id="mode-toggle">
                        <button class="mode-btn active" data-mode="wave" aria-label="波浪模式">Wave</button>
                        <button class="mode-btn" data-mode="breathe" aria-label="呼吸模式">Breathe</button>
                        <button class="mode-btn" data-mode="scatter" aria-label="散射模式">Scatter</button>
                        <button class="mode-btn" data-mode="cascade" aria-label="瀑布模式">Cascade</button>
                    </div>
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">振幅 <span class="ctrl-value" id="val-amplitude">50</span></label>
                    <input type="range" id="ctrl-amplitude" class="range-input" min="0" max="100" value="50">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">速度 <span class="ctrl-value" id="val-speed">50</span></label>
                    <input type="range" id="ctrl-speed" class="range-input" min="0" max="100" value="50">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">氛围配色</label>
                    <div class="palette-toggle" id="palette-toggle">
                        <button class="palette-btn active" data-palette="aurora" aria-label="极光">
                            <span class="swatch" style="background: linear-gradient(135deg, #c4b5fd, #67e8f9)"></span>
                        </button>
                        <button class="palette-btn" data-palette="ember" aria-label="烬火">
                            <span class="swatch" style="background: linear-gradient(135deg, #fda4af, #fdba74)"></span>
                        </button>
                        <button class="palette-btn" data-palette="forest" aria-label="森林">
                            <span class="swatch" style="background: linear-gradient(135deg, #86efac, #67e8f9)"></span>
                        </button>
                        <button class="palette-btn" data-palette="void" aria-label="虚空">
                            <span class="swatch" style="background: linear-gradient(135deg, #94a3b8, #e2e8f0)"></span>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
