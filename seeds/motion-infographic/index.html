<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Infographic 动效信息图 — 沉浸式数据脉动</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="deep-ocean">

    <a href="../../index.html" class="back-link" aria-label="返回数字花园">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <!-- 流体网格渐变背景 -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- 粒子流场画布 -->
    <canvas id="flow-canvas" aria-hidden="true"></canvas>

    <!-- 光标光晕 -->
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <main class="app-shell">

        <!-- 顶部导航 -->
        <nav class="info-nav">
            <div class="nav-brand">
                <span class="nav-icon">⟐</span>
                <div class="nav-text">
                    <h1 class="nav-title">Motion Infographic</h1>
                    <span class="nav-subtitle">动效信息图 · 沉浸式数据脉动</span>
                </div>
            </div>
            <div class="nav-controls">
                <div class="mode-toggle" id="mode-toggle" role="group" aria-label="交互模式">
                    <button class="mode-btn active" data-mode="float" aria-label="悬浮">悬浮</button>
                    <button class="mode-btn" data-mode="orbit" aria-label="轨道">轨道</button>
                </div>
                <div class="theme-toggle" id="theme-toggle" role="group" aria-label="氛围配色">
                    <button class="theme-btn active" data-theme="deep-ocean" aria-label="深海">深海</button>
                    <button class="theme-btn" data-theme="aurora" aria-label="极光">极光</button>
                    <button class="theme-btn" data-theme="ember" aria-label="余烬">余烬</button>
                    <button class="theme-btn" data-theme="void" aria-label="虚空">虚空</button>
                </div>
            </div>
        </nav>

        <!-- 标题区 -->
        <header class="hero" id="hero">
            <div class="hero-meta">
                <span class="hero-dot"></span>
                <span class="hero-tag">REAL-TIME · LIVE</span>
            </div>
            <h2 class="hero-title" id="hero-title">
                <span class="title-line">数据的</span>
                <span class="title-line title-accent">脉搏</span>
                <span class="title-line">正在跳动</span>
            </h2>
            <p class="hero-sub">悬停每一张数据卡片，感受数字以非线性动效弹入视野。<br>切换模式与配色，探索属于你的信息图节奏。</p>
            <div class="hero-stats">
                <div class="stat-pill"><span class="stat-num" data-count="8">0</span><span class="stat-label">数据维度</span></div>
                <div class="stat-divider"></div>
                <div class="stat-pill"><span class="stat-num" data-count="60">0</span><span class="stat-label">FPS 流场</span></div>
                <div class="stat-divider"></div>
                <div class="stat-pill"><span class="stat-num" data-count="4">0</span><span class="stat-label">氛围配色</span></div>
            </div>
        </header>

        <!-- 数据指标卡片区 -->
        <section class="metric-grid" id="metric-grid" aria-label="核心数据指标"></section>

        <!-- 双栏可视化区 -->
        <section class="dual-panel">

            <!-- 左：环形进度星座 -->
            <article class="glass-card ring-card" data-tilt>
                <div class="card-head">
                    <span class="card-label">CONTRIBUTION</span>
                    <span class="card-chip">贡献星图</span>
                </div>
                <div class="ring-stage">
                    <svg class="ring-svg" viewBox="0 0 240 240">
                        <defs>
                            <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="var(--color-accent)"/>
                                <stop offset="100%" stop-color="var(--color-accent-2)"/>
                            </linearGradient>
                        </defs>
                        <circle class="ring-track" cx="120" cy="120" r="92" />
                        <circle class="ring-fill" cx="120" cy="120" r="92" id="ring-fill" />
                        <circle class="ring-glow"  cx="120" cy="120" r="92" id="ring-glow" />
                    </svg>
                    <div class="ring-center">
                        <span class="ring-value" id="ring-value">0%</span>
                        <span class="ring-cap">综合活跃</span>
                    </div>
                    <!-- 环绕节点 -->
                    <div class="orbit-nodes" id="orbit-nodes"></div>
                </div>
                <div class="ring-legend">
                    <span><i class="dot dot-a"></i>核心域</span>
                    <span><i class="dot dot-b"></i>外围域</span>
                    <span><i class="dot dot-c"></i>边缘域</span>
                </div>
            </article>

            <!-- 右：柱状脉冲 -->
            <article class="glass-card bar-card" data-tilt>
                <div class="card-head">
                    <span class="card-label">PULSE</span>
                    <span class="card-chip">脉冲柱阵</span>
                </div>
                <div class="bar-stage" id="bar-stage"></div>
                <div class="bar-axis">
                    <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
                </div>
            </article>
        </section>

        <!-- 时间线 -->
        <section class="glass-card timeline-card">
            <div class="card-head">
                <span class="card-label">TIMELINE</span>
                <span class="card-chip">事件脉动</span>
            </div>
            <div class="timeline" id="timeline"></div>
        </section>

        <!-- 底部签名 -->
        <footer class="info-foot">
            <span class="foot-left">Motion Infographic · Crafted by <strong>EDEN</strong></span>
            <span class="foot-right" id="foot-clock">--:--:--</span>
        </footer>

    </main>

    <script src="main.js"></script>
</body>
</html>
