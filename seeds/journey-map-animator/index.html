<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Map Animator 旅途地图 - 沉浸式旅途动画</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <div class="cursor-glow" id="cursor-glow"></div>

    <main class="app-shell">
        <nav class="map-nav">
            <div class="nav-brand">
                <span class="nav-icon">🗺</span>
                <div class="nav-text">
                    <h1 class="nav-title">Journey Map</h1>
                    <span class="nav-subtitle">沉浸式旅途地图动画</span>
                </div>
            </div>
            <div class="nav-controls">
                <div class="theme-toggle" id="theme-toggle">
                    <button class="theme-btn active" data-theme="deep-ocean" aria-label="深海">深海</button>
                    <button class="theme-btn" data-theme="aurora" aria-label="极光">极光</button>
                    <button class="theme-btn" data-theme="ember" aria-label="余烬">余烬</button>
                    <button class="theme-btn" data-theme="void" aria-label="虚空">虚空</button>
                </div>
                <div class="speed-control">
                    <span class="speed-label">速度</span>
                    <input type="range" class="speed-slider" id="speed-slider" min="0.2" max="3" step="0.1" value="1">
                </div>
            </div>
        </nav>

        <div class="map-viewport" id="map-viewport">
            <canvas id="map-canvas"></canvas>

            <div class="waypoints-layer" id="waypoints-layer"></div>

            <div class="traveler-dot" id="traveler-dot">
                <div class="traveler-core"></div>
                <div class="traveler-ring"></div>
                <div class="traveler-glow"></div>
            </div>

            <div class="trail-canvas-wrap">
                <canvas id="trail-canvas"></canvas>
            </div>
        </div>

        <footer class="map-footer">
            <div class="footer-progress">
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="progress-markers" id="progress-markers"></div>
                </div>
                <span class="progress-label" id="progress-label">0%</span>
            </div>

            <div class="footer-controls">
                <button class="ctrl-btn" id="btn-prev" aria-label="上一站">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                    <span>上一站</span>
                </button>
                <button class="ctrl-btn ctrl-btn--primary" id="btn-play" aria-label="播放">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="icon-play"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="icon-pause" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    <span id="play-label">出发</span>
                </button>
                <button class="ctrl-btn" id="btn-next" aria-label="下一站">
                    <span>下一站</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>

            <div class="footer-info" id="footer-info">
                <div class="info-card glass-card">
                    <div class="info-icon" id="info-icon">🌊</div>
                    <div class="info-content">
                        <h3 class="info-title" id="info-title">旅途地图</h3>
                        <p class="info-desc" id="info-desc">点击出发，开始一段沉浸式旅途动画。每一段旅程都有独特的故事。</p>
                    </div>
                </div>
            </div>
        </footer>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="main.js"></script>
</body>
</html>
