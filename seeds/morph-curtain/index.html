<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph Curtain 变形幕 - 沉浸式窗帘变形体验</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas id="curtain-canvas"></canvas>

    <div class="cursor-glow" id="cursor-glow"></div>

    <main class="app-shell" id="app-shell">
        <nav class="top-nav">
            <div class="nav-brand">
                <span class="nav-icon">帷幕</span>
                <div class="nav-text">
                    <h1 class="nav-title">Morph Curtain</h1>
                    <span class="nav-subtitle">沉浸式窗帘变形体验</span>
                </div>
            </div>
            <div class="nav-controls">
                <div class="theme-toggle" id="theme-toggle">
                    <button class="theme-btn active" data-theme="deep-ocean" aria-label="深海">深海</button>
                    <button class="theme-btn" data-theme="aurora" aria-label="极光">极光</button>
                    <button class="theme-btn" data-theme="ember" aria-label="余烬">余烬</button>
                    <button class="theme-btn" data-theme="void" aria-label="虚空">虚空</button>
                </div>
                <div class="mode-toggle" id="mode-toggle">
                    <button class="mode-btn active" data-mode="push" aria-label="推开">推开</button>
                    <button class="mode-btn" data-mode="split" aria-label="裂开">裂开</button>
                    <button class="mode-btn" data-mode="dissolve" aria-label="溶解">溶解</button>
                </div>
                <button class="icon-btn" id="btn-fullscreen" aria-label="全屏">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                </button>
            </div>
        </nav>

        <div class="curtain-stage" id="curtain-stage">
            <div class="behind-scene" id="behind-scene">
                <div class="scene-content">
                    <div class="scene-icon">◇</div>
                    <h2 class="scene-title">帷幕之后</h2>
                    <p class="scene-desc">每一次变形都是一扇门，通向未知的视觉维度。推拉、撕裂、溶解 — 帷幕在你的指尖呼吸。</p>
                    <div class="scene-particles" id="scene-particles"></div>
                </div>
            </div>
            <canvas id="cloth-canvas"></canvas>
            <div class="curtain-overlay" id="curtain-overlay">
                <div class="overlay-text">
                    <span class="overlay-label">MORPH CURTAIN</span>
                    <span class="overlay-hint">移动光标扰动帷幕</span>
                </div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="param-group">
                <label class="param-label">刚度</label>
                <input type="range" class="param-slider" id="param-stiffness" min="1" max="10" value="5" step="0.5">
                <span class="param-value" id="val-stiffness">5.0</span>
            </div>
            <div class="param-group">
                <label class="param-label">阻尼</label>
                <input type="range" class="param-slider" id="param-damping" min="0.9" max="0.999" value="0.98" step="0.001">
                <span class="param-value" id="val-damping">0.980</span>
            </div>
            <div class="param-group">
                <label class="param-label">鼠标力</label>
                <input type="range" class="param-slider" id="param-force" min="5" max="80" value="30" step="1">
                <span class="param-value" id="val-force">30</span>
            </div>
            <button class="reset-btn" id="btn-reset">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                重置
            </button>
        </div>

        <footer class="stage-footer">
            <div class="footer-hint">
                <span class="hint-key">Click+Drag</span>
                <span class="hint-sep">或</span>
                <span class="hint-key">Hover</span>
                <span class="hint-label">扰动帷幕</span>
            </div>
            <div class="footer-meta">
                <span class="meta-chip" id="fps-counter">60 FPS</span>
                <span class="meta-chip" id="particle-count">0 点</span>
                <span class="meta-chip" id="mode-indicator">推开</span>
            </div>
        </footer>
    </main>

    <div class="transition-flash" id="transition-flash"></div>

    <script src="main.js"></script>
</body>
</html>
