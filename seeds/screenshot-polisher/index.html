<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Polisher - 截图美化器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回集木区</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container">
        <header class="panel-header">
            <div class="header-left">
                <h1 class="brand-title">Screenshot Polisher</h1>
                <p class="brand-subtitle">一键美化你的截图</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="reset-btn" title="重置">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
                <button class="icon-btn" id="download-btn" title="下载" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>
            </div>
        </header>

        <section class="workspace">
            <div class="preview-area" id="preview-area">
                <div class="upload-zone" id="upload-zone">
                    <div class="upload-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </div>
                    <p class="upload-text">拖拽截图到此处</p>
                    <p class="upload-hint">或点击选择文件</p>
                    <input type="file" id="file-input" accept="image/*" hidden>
                </div>
                <canvas id="preview-canvas"></canvas>
            </div>
        </section>

        <section class="controls-panel">
            <div class="control-group">
                <label class="control-label">背景样式</label>
                <div class="preset-btns">
                    <button class="preset-btn active" data-bg="gradient-mesh" aria-label="渐变网格">
                        <span class="preset-preview gradient-mesh"></span>
                    </button>
                    <button class="preset-btn" data-bg="aurora" aria-label="极光">
                        <span class="preset-preview aurora"></span>
                    </button>
                    <button class="preset-btn" data-bg="sunset" aria-label="日落">
                        <span class="preset-preview sunset"></span>
                    </button>
                    <button class="preset-btn" data-bg="ocean" aria-label="深海">
                        <span class="preset-preview ocean"></span>
                    </button>
                    <button class="preset-btn" data-bg="solid" aria-label="纯色">
                        <span class="preset-preview solid"></span>
                    </button>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">内边距</label>
                <div class="slider-container">
                    <input type="range" id="padding-slider" min="20" max="120" value="64" class="slider">
                    <span class="slider-value" id="padding-value">64</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">圆角</label>
                <div class="slider-container">
                    <input type="range" id="radius-slider" min="0" max="48" value="16" class="slider">
                    <span class="slider-value" id="radius-value">16</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">阴影</label>
                <div class="slider-container">
                    <input type="range" id="shadow-slider" min="0" max="100" value="60" class="slider">
                    <span class="slider-value" id="shadow-value">60</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">缩放</label>
                <div class="slider-container">
                    <input type="range" id="scale-slider" min="50" max="150" value="100" class="slider">
                    <span class="slider-value" id="scale-value">100%</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn" id="copy-btn" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <span>复制</span>
                </button>
                <button class="action-btn primary" id="export-btn" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>导出 PNG</span>
                </button>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">操作成功</div>

    <script src="main.js"></script>
</body>
</html>
