<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Drawer 记忆档案抽屉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="nebula">
    <!-- 返回数字花园主页 -->
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回集木区</span>
    </a>

    <!-- 动态流体网格渐变背景 -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="mesh-grain"></div>
        <div class="mesh-vignette"></div>
    </div>

    <!-- 环境浮尘层（JS 生成粒子） -->
    <div class="dust-field" id="dust-field" aria-hidden="true"></div>

    <!-- 主档案柜容器 -->
    <main class="cabinet glass sheen" id="cabinet-root">
        <header class="panel-header">
            <div class="brand-block">
                <h1 class="brand-title">Archive<span class="brand-dot">/</span>Drawer</h1>
                <p class="brand-subtitle" id="status-text">记忆在此归档 · 拉开抽屉取回光</p>
            </div>
            <div class="header-side">
                <div class="clock" id="clock">00:00:00</div>
                <div class="stat-chip" id="stat-chip">ARCHIVED · 00</div>
            </div>
        </header>

        <div class="controls-row">
            <div class="search-shell">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M21 21l-4.35-4.35"></path>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="检索档案 RETRIEVE…" autocomplete="off" spellcheck="false">
            </div>
            <button class="icon-btn" id="shuffle-btn" aria-label="随机调出一份档案">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 3 21 3 21 8"></polyline>
                    <line x1="4" y1="20" x2="21" y2="3"></line>
                    <polyline points="21 16 21 21 16 21"></polyline>
                    <line x1="15" y1="15" x2="21" y2="21"></line>
                    <line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
            </button>
            <button class="icon-btn" id="theme-btn" aria-label="切换氛围配色">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
            </button>
        </div>

        <!-- 抽屉柜（JS 渲染） -->
        <section class="cabinet-body" id="cabinet" aria-label="档案抽屉列表"></section>

        <footer class="panel-footer">
            <span class="hint-key">↑↓</span> 切换抽屉
            <span class="hint-sep">·</span>
            <span class="hint-key">ENTER</span> 开合
            <span class="hint-sep">·</span>
            <span class="hint-key">ESC</span> 收起
            <span class="hint-right" id="theme-label">NEBULA</span>
        </footer>
    </main>

    <!-- 档案详情透视层 -->
    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <article class="modal glass sheen" id="modal">
            <button class="modal-close" id="modal-close" aria-label="关闭详情">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-watermark" id="modal-watermark">000</div>
            <div class="modal-meta">
                <span class="modal-id" id="modal-id">ARC-000</span>
                <span class="modal-date" id="modal-date">0000.00.00</span>
            </div>
            <h2 class="modal-title" id="modal-title">Untitled</h2>
            <div class="modal-tags" id="modal-tags"></div>
            <div class="modal-divider" id="modal-divider"></div>
            <p class="modal-excerpt" id="modal-excerpt"></p>
            <div class="modal-foot">
                <span class="modal-foot-left">RETRIEVED FROM ARCHIVE</span>
                <span class="modal-foot-right" id="modal-source">DRAWER · 0000</span>
            </div>
        </article>
    </div>

    <script src="main.js"></script>
</body>
</html>
