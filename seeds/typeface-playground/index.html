<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typeface Playground — 排版铸造实验室</title>
    <meta name="description" content="沉浸式字体排版游乐场。实时操控字重、字宽、斜度、光学尺寸、字距张力与基线律动，生成可复制的 CSS。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@100..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link" aria-label="返回数字花园">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <!-- Fluid Mesh Gradient Background -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="grain-overlay"></div>
    </div>

    <!-- Cursor Light Glow -->
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <main class="app-shell">
        <!-- === Header === -->
        <header class="panel-header">
            <div class="brand-group">
                <h1 class="brand-title">Type<span class="brand-dot">·</span>face<span class="brand-fade"> Playground</span></h1>
                <p class="brand-subtitle">排版铸造实验室 — 字距张力 · 基线律动 · 光学尺寸的实时塑形</p>
            </div>
            <div class="header-actions">
                <div class="palette-group" role="group" aria-label="氛围配色">
                    <button class="palette-btn active" data-palette="obsidian" aria-label="黑曜">
                        <span class="swatch" style="background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899)"></span>
                    </button>
                    <button class="palette-btn" data-palette="verdigris" aria-label="铜绿">
                        <span class="swatch" style="background:linear-gradient(135deg,#14b8a6,#22d3ee,#5eead4)"></span>
                    </button>
                    <button class="palette-btn" data-palette="ember" aria-label="余烬">
                        <span class="swatch" style="background:linear-gradient(135deg,#f59e0b,#ef4444,#f97316)"></span>
                    </button>
                    <button class="palette-btn" data-palette="halcyon" aria-label="静海">
                        <span class="swatch" style="background:linear-gradient(135deg,#a5b4fc,#7dd3fc,#e0e7ff)"></span>
                    </button>
                </div>
            </div>
        </header>

        <!-- === Main Grid === -->
        <div class="work-grid">
            <!-- === Left: Specimen Stage === -->
            <section class="specimen-stage" id="specimen-stage" aria-label="字体样本舞台">
                <canvas id="field-canvas" aria-hidden="true"></canvas>

                <!-- Baseline Rhythm Grid -->
                <div class="baseline-grid" id="baseline-grid" aria-hidden="true"></div>

                <!-- Kerning Pair Tension Trackers -->
                <div class="pair-track" id="pair-track" aria-hidden="true"></div>

                <!-- The Specimen Word -->
                <div class="specimen-wrap" id="specimen-wrap">
                    <div class="specimen-line main-line" id="specimen-main" aria-live="polite">
                        <!-- characters injected by JS -->
                    </div>
                    <div class="specimen-meta">
                        <span class="meta-tag" id="meta-font">Outfit</span>
                        <span class="meta-sep">/</span>
                        <span class="meta-tag" id="meta-weight">wght 600</span>
                        <span class="meta-sep">/</span>
                        <span class="meta-tag" id="meta-axis">wdth 100 · slnt 0°</span>
                    </div>
                </div>

                <!-- Stage overlays -->
                <div class="stage-hint" id="stage-hint">
                    <span class="hint-dot"></span>
                    <span class="hint-text">悬停字符感受磁力 · 拖拽张力球调节字距</span>
                </div>

                <div class="stage-tools">
                    <button class="tool-btn active" id="tool-grid" title="切换基线网格" aria-pressed="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <button class="tool-btn active" id="tool-pair" title="切换字距张力" aria-pressed="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 12h6"/></svg>
                    </button>
                    <button class="tool-btn" id="tool-force" title="磁力扰动" aria-pressed="false">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    </button>
                </div>
            </section>

            <!-- === Right: Control Rail === -->
            <aside class="control-rail">
                <!-- Text Input -->
                <div class="rail-section">
                    <div class="input-shell">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                        </span>
                        <input type="text" id="text-input" class="text-input" maxlength="20" value="foundry" placeholder="输入文字…" autocomplete="off" spellcheck="false" aria-label="样本文字">
                        <span class="input-count" id="input-count">7 / 20</span>
                    </div>
                </div>

                <!-- Typography Axes -->
                <div class="rail-section">
                    <h3 class="rail-heading">Typography Axes</h3>

                    <div class="control-group" data-axis="weight">
                        <label class="control-label" for="ctrl-weight">Weight <span class="label-hint">字重</span></label>
                        <div class="slider-wrap">
                            <input type="range" id="ctrl-weight" min="100" max="900" step="10" value="600" class="slider" aria-label="字重">
                            <span class="slider-val" id="val-weight">600</span>
                        </div>
                    </div>

                    <div class="control-group" data-axis="width">
                        <label class="control-label" for="ctrl-width">Width <span class="label-hint">字宽</span></label>
                        <div class="slider-wrap">
                            <input type="range" id="ctrl-width" min="75" max="150" step="1" value="100" class="slider" aria-label="字宽">
                            <span class="slider-val" id="val-width">1.00</span>
                        </div>
                    </div>

                    <div class="control-group" data-axis="slant">
                        <label class="control-label" for="ctrl-slant">Slant <span class="label-hint">斜度</span></label>
                        <div class="slider-wrap">
                            <input type="range" id="ctrl-slant" min="-15" max="15" step="1" value="0" class="slider" aria-label="斜度">
                            <span class="slider-val" id="val-slant">0°</span>
                        </div>
                    </div>

                    <div class="control-group" data-axis="size">
                        <label class="control-label" for="ctrl-size">Size <span class="label-hint">字号</span></label>
                        <div class="slider-wrap">
                            <input type="range" id="ctrl-size" min="48" max="200" step="1" value="128" class="slider" aria-label="字号">
                            <span class="slider-val" id="val-size">128px</span>
                        </div>
                    </div>

                    <div class="control-group" data-axis="tracking">
                        <label class="control-label" for="ctrl-tracking">Tracking <span class="label-hint">字距</span></label>
                        <div class="slider-wrap">
                            <input type="range" id="ctrl-tracking" min="-8" max="30" step="1" value="0" class="slider" aria-label="字距">
                            <span class="slider-val" id="val-tracking">0.00em</span>
                        </div>
                    </div>

                    <div class="control-group" data-axis="leading">
                        <label class="control-label" for="ctrl-leading">Leading <span class="label-hint">行高</span></label>
                        <div class="slider-wrap">
                            <input type="range" id="ctrl-leading" min="80" max="200" step="1" value="110" class="slider" aria-label="行高">
                            <span class="slider-val" id="val-leading">1.10</span>
                        </div>
                    </div>
                </div>

                <!-- Effect Toggles -->
                <div class="rail-section">
                    <h3 class="rail-heading">Texture</h3>
                    <div class="toggle-group">
                        <button class="toggle-chip active" data-effect="gradient" aria-pressed="true">渐变描色</button>
                        <button class="toggle-chip active" data-effect="outline" aria-pressed="true">描边光泽</button>
                        <button class="toggle-chip" data-effect="uppercase" aria-pressed="false">全大写</button>
                        <button class="toggle-chip" data-effect="italic" aria-pressed="false">斜体</button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="rail-section action-row">
                    <button class="action-btn" id="btn-shuffle" title="随机铸造">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                        <span>随机</span>
                    </button>
                    <button class="action-btn primary" id="btn-reset" title="重置参数">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        <span>重置</span>
                    </button>
                </div>

                <!-- CSS Export -->
                <div class="rail-section export-section">
                    <div class="export-head">
                        <h3 class="rail-heading">Generated CSS</h3>
                        <button class="copy-btn" id="btn-copy" title="复制 CSS">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            <span class="copy-label">复制</span>
                        </button>
                    </div>
                    <pre class="code-block" id="code-output" aria-live="polite"></pre>
                </div>
            </aside>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="main.js"></script>
</body>
</html>
