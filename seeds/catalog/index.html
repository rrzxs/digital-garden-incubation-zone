<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog · 策展陈列室</title>
    <meta name="description" content="沉浸式策展产品陈列室。磁吸标签过滤、3D 倾斜卡片物理、展开式详情覆盖层、粒子流场与微晶玻璃态容器，4种氛围配色">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-palette="aurora">

    <!-- 返回链接 -->
    <a href="../../index.html" class="back-link" aria-label="返回数字花园">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <!-- 流体网格渐变背景 -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
        <div class="grain"></div>
    </div>

    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <!-- 顶部控制条 -->
    <header class="topbar glass-bar">
        <div class="brand">
            <span class="brand-glyph">◈</span>
            <div class="brand-text">
                <span class="brand-title">Catalog</span>
                <span class="brand-sub">策展陈列室 · Curated Objects</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="hud" id="hud">
                <span class="hud-dot" id="hud-dot"></span>
                <span class="hud-text" id="hud-text">悬停 · 筛选 · 展开</span>
            </div>
            <div class="palette-picker" role="group" aria-label="氛围配色">
                <button class="palette-dot active" data-palette="aurora" style="--dot:#7af0c8" title="极光 Aurora" aria-label="极光配色"></button>
                <button class="palette-dot" data-palette="ember"  style="--dot:#f0a07a" title="余烬 Ember" aria-label="余烬配色"></button>
                <button class="palette-dot" data-palette="abyss"  style="--dot:#7aa8f0" title="深渊 Abyss" aria-label="深渊配色"></button>
                <button class="palette-dot" data-palette="orchid" style="--dot:#b488f0" title="兰若 Orchid" aria-label="兰若配色"></button>
            </div>
        </div>
    </header>

    <!-- 主舞台 -->
    <main class="stage">

        <!-- 序言 -->
        <section class="preamble reveal">
            <span class="pre-tag">CATALOG / VOL.I</span>
            <h1 class="pre-title">
                <span class="pre-line">Objects of</span>
                <span class="pre-line pre-italic">quiet</span>
                <span class="pre-line">obsession.</span>
            </h1>
            <p class="pre-desc">十二件器物，被仔细地安放在微晶玻璃架上。用磁吸标签筛选它们，倾斜你的视角。点击任意卡片，它会像展开的折页一样揭示全部细节。</p>
            <div class="pre-stats">
                <span class="stat-pill"><strong id="stat-total">12</strong> 件器物</span>
                <span class="stat-pill"><strong id="stat-visible">12</strong> 件在展</span>
                <span class="stat-pill"><strong>4</strong> 个分类</span>
            </div>
        </section>

        <!-- 筛选标签栏 -->
        <section class="filter-bar glass-bar reveal" id="filter-bar" role="tablist" aria-label="分类筛选">
            <div class="filter-indicator" id="filter-indicator" aria-hidden="true"></div>
            <!-- 标签由 JS 注入 -->
        </section>

        <!-- 卡片网格 -->
        <section class="card-grid" id="card-grid" aria-label="器物陈列">
            <!-- 卡片由 JS 注入 -->
        </section>

        <!-- 空状态 -->
        <div class="empty-state" id="empty-state" hidden>
            <span class="empty-glyph">◌</span>
            <p>该分类暂无器物</p>
        </div>

    </main>

    <!-- 详情覆盖层 -->
    <div class="overlay-backdrop" id="overlay-backdrop" aria-hidden="true"></div>
    <section class="detail-overlay glass-bar" id="detail-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="detail-title">
        <button class="detail-close" id="detail-close" aria-label="关闭详情">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <div class="detail-inner">
            <div class="detail-visual" id="detail-visual" aria-hidden="true">
                <span class="detail-glyph" id="detail-glyph"></span>
            </div>
            <div class="detail-body">
                <div class="detail-meta">
                    <span class="detail-cat" id="detail-cat"></span>
                    <span class="detail-idx" id="detail-idx"></span>
                </div>
                <h2 class="detail-title" id="detail-title"></h2>
                <p class="detail-desc" id="detail-desc"></p>
                <div class="detail-specs" id="detail-specs"></div>
                <div class="detail-tags" id="detail-tags"></div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <span class="foot-text">Catalog · 策展陈列室 · 由 <strong>EDEN</strong> 孵化</span>
        <span class="foot-mode" id="foot-mode">— 全部在展</span>
    </footer>

    <script src="main.js"></script>
</body>
</html>
