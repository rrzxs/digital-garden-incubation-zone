<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromaSift — 沉浸式渐变配色灵感探索器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gradientCanvas"></canvas>

  <div id="overlay"></div>

  <header id="topBar">
    <div class="brand">
      <span class="brand-icon">◐</span>
      <span class="brand-name">ChromaSift</span>
    </div>
    <p class="tagline">Shift through infinite color gradients.</p>
  </header>

  <aside id="controlPanel" class="glass-panel">
    <div class="panel-header">
      <h2>Sift Controls</h2>
      <button id="togglePanel" class="icon-btn" aria-label="Toggle panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <div class="panel-body">
      <section class="control-group">
        <label>Hue Range</label>
        <div class="range-row">
          <input type="range" id="hueStart" min="0" max="360" value="0" class="slider slider-hue">
          <span class="range-val" id="hueStartVal">0°</span>
        </div>
        <div class="range-row">
          <input type="range" id="hueEnd" min="0" max="360" value="180" class="slider slider-hue">
          <span class="range-val" id="hueEndVal">180°</span>
        </div>
      </section>

      <section class="control-group">
        <label>Saturation</label>
        <div class="range-row">
          <input type="range" id="saturation" min="20" max="100" value="75" class="slider">
          <span class="range-val" id="saturationVal">75%</span>
        </div>
      </section>

      <section class="control-group">
        <label>Lightness</label>
        <div class="range-row">
          <input type="range" id="lightness" min="15" max="85" value="55" class="slider">
          <span class="range-val" id="lightnessVal">55%</span>
        </div>
      </section>

      <section class="control-group">
        <label>Gradient Stops</label>
        <div class="stop-selector">
          <button class="stop-btn active" data-stops="2">2</button>
          <button class="stop-btn" data-stops="3">3</button>
          <button class="stop-btn" data-stops="4">4</button>
          <button class="stop-btn" data-stops="5">5</button>
        </div>
      </section>

      <section class="control-group">
        <label>Flow Speed</label>
        <div class="range-row">
          <input type="range" id="flowSpeed" min="1" max="10" value="4" class="slider">
          <span class="range-val" id="flowSpeedVal">4</span>
        </div>
      </section>

      <section class="control-group">
        <label>Angle</label>
        <div class="range-row">
          <input type="range" id="gradientAngle" min="0" max="360" value="135" class="slider">
          <span class="range-val" id="gradientAngleVal">135°</span>
        </div>
      </section>

      <div class="action-buttons">
        <button id="randomizeBtn" class="action-btn secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          Randomize
        </button>
        <button id="lockBtn" class="action-btn primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Lock
        </button>
      </div>
    </div>
  </aside>

  <div id="colorBar" class="glass-panel">
    <div id="colorPreview" class="color-preview"></div>
    <div id="colorInfo" class="color-info">
      <span id="hslDisplay" class="mono">hsl(0, 75%, 55%)</span>
      <span id="hexDisplay" class="mono">#DB5E5E</span>
    </div>
  </div>

  <div id="savedPanel" class="glass-panel hidden">
    <div class="panel-header">
      <h2>Saved Gradients</h2>
      <button id="closeSaved" class="icon-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="savedList" class="saved-list"></div>
  </div>

  <button id="showSavedBtn" class="fab glass-panel" aria-label="Show saved gradients">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
  </button>

  <div id="codeModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content glass-panel">
      <div class="panel-header">
        <h2>CSS Gradient Code</h2>
        <button id="closeModal" class="icon-btn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <pre id="codeOutput" class="code-block"></pre>
      <div class="modal-actions">
        <button id="copyBtn" class="action-btn primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy Code
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden">
    <span id="toastMsg"></span>
  </div>

  <footer id="bottomHint">
    <span>Drag across the canvas to sift colors</span>
    <span class="separator">·</span>
    <span>Scroll to adjust lightness</span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
