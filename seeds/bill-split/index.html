<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Split · Split smart, settle easy.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <div>
          <h1>Bill Split</h1>
          <p class="tagline">Split smart, settle easy.</p>
        </div>
      </div>
      <button class="btn-reset" id="btnReset" title="重置全部">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
    </header>

    <main class="app-body">
      <section class="panel panel-bill">
        <div class="panel-header">
          <h2>账单明细</h2>
          <span class="badge" id="billTotal">¥0.00</span>
        </div>
        <div class="item-form glass-card">
          <input type="text" id="itemName" placeholder="菜品 / 项目名称" class="input" />
          <input type="number" id="itemPrice" placeholder="金额" class="input input-price" min="0" step="0.01" />
          <button class="btn-add" id="btnAddItem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="items-list" id="itemsList"></div>
      </section>

      <section class="panel panel-diners">
        <div class="panel-header">
          <h2>用餐者</h2>
          <span class="badge" id="dinerCount">0 人</span>
        </div>
        <div class="diner-form glass-card">
          <input type="text" id="dinerName" placeholder="姓名" class="input" maxlength="10" />
          <button class="btn-add" id="btnAddDiner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="diners-list" id="dinersList"></div>
      </section>

      <section class="panel panel-assign">
        <div class="panel-header">
          <h2>分摊分配</h2>
          <span class="split-mode-toggle" id="splitModeToggle">
            <button class="mode-btn active" data-mode="equal">均分</button>
            <button class="mode-btn" data-mode="custom">自定义</button>
          </span>
        </div>
        <p class="assign-hint" id="assignHint">添加菜品和用餐者后，将菜品拖拽至对应的人头像上</p>
        <div class="assign-grid" id="assignGrid"></div>
      </section>

      <section class="panel panel-result">
        <div class="panel-header">
          <h2>结算预览</h2>
        </div>
        <div class="result-list" id="resultList"></div>
        <div class="result-summary glass-card" id="resultSummary" style="display:none;">
          <div class="summary-row">
            <span>总计</span>
            <span id="summaryTotal">¥0.00</span>
          </div>
          <div class="summary-row">
            <span>已分配</span>
            <span id="summaryAssigned">¥0.00</span>
          </div>
          <div class="summary-row summary-balance">
            <span>差额</span>
            <span id="summaryBalance">¥0.00</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="drag-ghost" id="dragGhost"></div>

  <script src="main.js"></script>
</body>
</html>
