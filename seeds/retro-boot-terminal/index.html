<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Boot Terminal · 复古开机终端</title>
    <meta name="description" content="沉浸式复古开机终端体验。BIOS 自检序列、CRT 扫描线、微晶玻璃态终端容器与可交互 Shell，4 种磷光配色。">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050b07'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='28' fill='%2310b981' text-anchor='middle'%3E%26gt;_%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="phosphor">

    <!-- === 流体渐变背景 === -->
    <div class="ambient-stage" aria-hidden="true">
        <div class="fluid-orb orb-a"></div>
        <div class="fluid-orb orb-b"></div>
        <div class="fluid-orb orb-c"></div>
        <div class="noise-veil"></div>
    </div>

    <!-- === 顶部工具条 === -->
    <header class="hud-bar">
        <div class="hud-brand">
            <span class="hud-chip">⏻</span>
            <span class="hud-title">RETRO·BOOT·TERMINAL</span>
            <span class="hud-sub">EDEN BIOS v2.6</span>
        </div>
        <div class="hud-actions">
            <div class="theme-switch" role="group" aria-label="磷光配色">
                <button class="theme-dot" data-set-theme="phosphor" title="Phosphor 磷光绿"></button>
                <button class="theme-dot" data-set-theme="amber" title="Amber 琥珀"></button>
                <button class="theme-dot" data-set-theme="ice" title="Ice 冰蓝"></button>
                <button class="theme-dot" data-set-theme="magenta" title="Magenta 品红"></button>
            </div>
            <button class="hud-btn" id="btn-crt" title="切换 CRT 扫描线">
                <span class="hud-btn-glyph">▤</span><span class="hud-btn-label">CRT</span>
            </button>
            <button class="hud-btn" id="btn-audio" title="切换音效">
                <span class="hud-btn-glyph">♪</span><span class="hud-btn-label" id="audio-label">SFX ON</span>
            </button>
            <button class="hud-btn hud-btn-accent" id="btn-reboot" title="重新执行开机序列">
                <span class="hud-btn-glyph">⟳</span><span class="hud-btn-label">REBOOT</span>
            </button>
        </div>
    </header>

    <!-- === 微晶玻璃态终端容器 === -->
    <main class="terminal-stage">
        <section class="terminal-shell glass-crt" id="terminal-shell">
            <!-- 窗口标题栏 -->
            <div class="term-titlebar">
                <div class="term-dots">
                    <span class="dot dot-r"></span>
                    <span class="dot dot-y"></span>
                    <span class="dot dot-g"></span>
                </div>
                <div class="term-title">eden@garden: ~/boot — ssh 9600 baud</div>
                <div class="term-signal" id="term-signal">
                    <span class="signal-bar"></span><span class="signal-bar"></span>
                    <span class="signal-bar"></span><span class="signal-bar"></span>
                </div>
            </div>

            <!-- CRT 屏幕本体 -->
            <div class="crt-screen" id="crt-screen">
                <div class="crt-flicker" aria-hidden="true"></div>
                <div class="crt-scanlines" aria-hidden="true"></div>
                <div class="crt-vignette" aria-hidden="true"></div>

                <!-- 开机画布 -->
                <div class="boot-layer" id="boot-layer">
                    <div class="boot-lines" id="boot-lines"></div>
                    <div class="boot-progress" id="boot-progress">
                        <div class="boot-progress-track">
                            <div class="boot-progress-fill" id="boot-progress-fill"></div>
                        </div>
                        <div class="boot-progress-meta">
                            <span id="boot-progress-label">POST…</span>
                            <span id="boot-progress-pct">0%</span>
                        </div>
                    </div>
                </div>

                <!-- 交互终端 -->
                <div class="shell-layer is-hidden" id="shell-layer">
                    <div class="shell-output" id="shell-output" aria-live="polite"></div>
                    <div class="shell-input-row" id="shell-input-row">
                        <span class="prompt-user">eden@garden</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-sigil">$</span>
                        <input class="shell-input" id="shell-input" type="text"
                               autocomplete="off" spellcheck="false" autofocus
                               placeholder="type 'help' and press ⏎" />
                        <span class="caret-block" id="caret-block" aria-hidden="true"></span>
                    </div>
                </div>
            </div>

            <!-- 底部状态条 -->
            <div class="term-statusbar">
                <span class="status-cell" id="status-mode">MODE · BOOT</span>
                <span class="status-cell status-dim" id="status-clock">--:--:--</span>
                <span class="status-cell status-dim" id="status-theme">THEME · PHOSPHOR</span>
                <span class="status-cell status-pulse"><span class="pulse-dot"></span><span id="status-uplink">UPLINK STABLE</span></span>
            </div>
        </section>

        <p class="stage-hint">点击屏幕唤醒光标 · ↑↓ 翻阅命令历史 · <kbd>Tab</kbd> 补全 · <kbd>Ctrl</kbd>+<kbd>L</kbd> 清屏</p>
    </main>

    <script src="main.js"></script>
</body>
</html>
