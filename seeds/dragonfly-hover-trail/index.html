<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragonfly Hover Trail 蜻蜓悬停轨迹</title>
    <meta name="description" content="沉浸式蜻蜓悬停轨迹微交互体验。弹簧-阻尼物理驱动的蜻蜓群追随光标悬停飞舞，留下流体光痕轨迹，4种飞行模式（追随/环绕/编队/散逸）、脉冲冲击波、粒子流场与微晶玻璃态容器，4种氛围配色">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="palette-jade" data-mode="chase">

    <!-- ====== MESH GRADIENT BACKGROUND ====== -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- ====== MAIN CANVAS ====== -->
    <canvas id="trail-canvas" aria-label="蜻蜓轨迹交互画布"></canvas>

    <!-- ====== CUSTOM CURSOR (flower) ====== -->
    <div class="cursor-shell" aria-hidden="true">
        <div class="cursor-core"></div>
        <div class="cursor-ring"></div>
        <div class="cursor-petal"></div>
        <div class="cursor-aura"></div>
    </div>

    <!-- ====== HUD: TITLE ====== -->
    <header class="hud-header">
        <a href="../../index.html" class="back-link" aria-label="返回数字花园">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Garden</span>
        </a>
        <div class="brand">
            <h1 class="brand-title">DRAGONFLY <span class="accent-word">HOVER TRAIL</span></h1>
            <p class="brand-sub">蜻蜓悬停轨迹 · 弹簧-阻尼飞舞物理场</p>
        </div>
        <div class="palette-row" role="group" aria-label="氛围配色">
            <button class="palette-btn active" data-palette="jade" aria-label="翠羽">
                <span class="swatch sw-jade"></span>
            </button>
            <button class="palette-btn" data-palette="ember" aria-label="赤夏">
                <span class="swatch sw-ember"></span>
            </button>
            <button class="palette-btn" data-palette="bloom" aria-label="绀霞">
                <span class="swatch sw-bloom"></span>
            </button>
            <button class="palette-btn" data-palette="frost" aria-label="霜降">
                <span class="swatch sw-frost"></span>
            </button>
        </div>
    </header>

    <!-- ====== CONTROL PANEL ====== -->
    <aside class="control-panel" role="complementary" aria-label="控制面板">
        <div class="panel-section">
            <div class="section-label">
                <span class="dot"></span>
                <span>FLIGHT MODE</span>
            </div>
            <div class="mode-grid">
                <button class="mode-btn active" data-mode="chase">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12l5-5 5 5-5 5z"/>
                        <path d="M15 12l4-2M15 12l4 2"/>
                    </svg>
                    <span class="mode-name">追随</span>
                    <span class="mode-tag">CHASE</span>
                </button>
                <button class="mode-btn" data-mode="orbit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="12" rx="9" ry="4"/>
                        <circle cx="12" cy="12" r="1.5"/>
                    </svg>
                    <span class="mode-name">环绕</span>
                    <span class="mode-tag">ORBIT</span>
                </button>
                <button class="mode-btn" data-mode="formation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 4v6M12 14v6M4 12h6M14 12h6"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                    <span class="mode-name">编队</span>
                    <span class="mode-tag">FORMATION</span>
                </button>
                <button class="mode-btn" data-mode="scatter">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="2"/>
                        <path d="M12 4l-2 4M12 4l2 4M4 12l4-2M4 12l4 2M12 20l-2-4M12 20l2-4M20 12l-4-2M20 12l-4 2"/>
                    </svg>
                    <span class="mode-name">散逸</span>
                    <span class="mode-tag">SCATTER</span>
                </button>
            </div>
        </div>

        <div class="panel-section">
            <div class="section-label">
                <span class="dot"></span>
                <span>SWARM PARAMETERS</span>
            </div>
            <div class="slider-stack">
                <div class="slider-row">
                    <div class="slider-head">
                        <span class="slider-label">蜻蜓数量</span>
                        <span class="slider-val" id="val-count">18</span>
                    </div>
                    <input type="range" min="4" max="48" step="1" value="18" id="slider-count" class="range-input">
                </div>
                <div class="slider-row">
                    <div class="slider-head">
                        <span class="slider-label">悬停半径</span>
                        <span class="slider-val" id="val-radius">160</span>
                    </div>
                    <input type="range" min="40" max="360" step="5" value="160" id="slider-radius" class="range-input">
                </div>
                <div class="slider-row">
                    <div class="slider-head">
                        <span class="slider-label">飞行弹性</span>
                        <span class="slider-val" id="val-spring">0.06</span>
                    </div>
                    <input type="range" min="10" max="160" step="2" value="60" id="slider-spring" class="range-input">
                </div>
                <div class="slider-row">
                    <div class="slider-head">
                        <span class="slider-label">空气阻尼</span>
                        <span class="slider-val" id="val-damp">0.88</span>
                    </div>
                    <input type="range" min="70" max="97" step="1" value="88" id="slider-damp" class="range-input">
                </div>
                <div class="slider-row">
                    <div class="slider-head">
                        <span class="slider-label">轨迹长度</span>
                        <span class="slider-val" id="val-trail">24</span>
                    </div>
                    <input type="range" min="0" max="60" step="2" value="24" id="slider-trail" class="range-input">
                </div>
            </div>
        </div>

        <div class="panel-section">
            <div class="section-label">
                <span class="dot"></span>
                <span>ACTIONS</span>
            </div>
            <div class="action-row">
                <button class="action-btn" id="btn-gather">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="2"/>
                        <path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/>
                    </svg>
                    <span>聚拢</span>
                </button>
                <button class="action-btn" id="btn-burst">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
                    </svg>
                    <span>惊飞</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- ====== TELEMETRY HUD ====== -->
    <div class="telemetry" role="status" aria-live="polite">
        <div class="tele-block">
            <span class="tele-key">FPS</span>
            <span class="tele-val" id="tele-fps">60</span>
        </div>
        <div class="tele-divider"></div>
        <div class="tele-block">
            <span class="tele-key">SWARM</span>
            <span class="tele-val" id="tele-swarm">18</span>
        </div>
        <div class="tele-divider"></div>
        <div class="tele-block">
            <span class="tele-key">WING</span>
            <span class="tele-val" id="tele-wing">0.0</span>
        </div>
        <div class="tele-divider"></div>
        <div class="tele-block">
            <span class="tele-key">MODE</span>
            <span class="tele-val" id="tele-mode">CHASE</span>
        </div>
    </div>

    <!-- ====== HINT ====== -->
    <div class="hint" id="hint">
        <span class="hint-pulse"></span>
        <span>移动光标引领蜻蜓群飞 · 点击触发惊飞涟漪 · 切换模式探索不同飞舞</span>
    </div>

    <script src="main.js"></script>
</body>
</html>
