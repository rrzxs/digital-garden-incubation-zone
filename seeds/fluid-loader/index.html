<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Loader - 流体加载动画</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fluid-background">
        <div class="fluid-gradient-1"></div>
        <div class="fluid-gradient-2"></div>
        <div class="fluid-gradient-3"></div>
    </div>

    <div class="container">
        <div class="glass-card">
            <div class="card-header">
                <h1 class="title">Fluid Loader</h1>
                <p class="subtitle">流体模拟驱动的加载动画</p>
            </div>

            <div class="canvas-wrapper">
                <canvas id="fluidCanvas"></canvas>
                <div class="loading-overlay">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progressText">0%</span>
                    </div>
                    <p class="hint-text">移动鼠标扰动流体</p>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="restartBtn">
                    <span class="btn-icon">↻</span>
                    <span class="btn-text">重新开始</span>
                </button>
                <button class="control-btn" id="toggleModeBtn">
                    <span class="btn-icon">⚡</span>
                    <span class="btn-text">切换模式</span>
                </button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">粒子数量</span>
                    <span class="stat-value" id="particleCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">FPS</span>
                    <span class="stat-value" id="fpsCount">0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
