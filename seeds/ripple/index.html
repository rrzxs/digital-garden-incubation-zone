<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple 涟漪 - 沉浸式水波交互体验</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container">
        <header class="panel-header">
            <div class="brand-group">
                <h1 class="brand-title">Ripple.</h1>
                <p class="brand-subtitle">沉浸式水波交互体验</p>
            </div>
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="interact" aria-label="交互模式">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a10 10 0 1 0 10 10"/>
                        <path d="M12 12l4-4"/>
                        <path d="M22 2L12 12"/>
                    </svg>
                </button>
                <button class="mode-btn" data-mode="auto" aria-label="自动模式">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="10,8 16,12 10,16"/>
                    </svg>
                </button>
            </div>
        </header>

        <section class="canvas-wrapper">
            <canvas id="ripple-canvas"></canvas>
            <div class="canvas-overlay" id="canvas-overlay">
                <div class="hint-pulse">
                    <span class="pulse-ring"></span>
                    <span class="pulse-core"></span>
                </div>
                <span class="hint-text">轻触水面，泛起涟漪</span>
            </div>
        </section>

        <section class="controls-panel">
            <div class="control-group">
                <label class="control-label">波纹半径</label>
                <div class="slider-container">
                    <input type="range" id="ripple-radius" min="20" max="120" value="60" class="slider">
                    <span class="slider-value" id="radius-value">60</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">衰减速度</label>
                <div class="slider-container">
                    <input type="range" id="decay-rate" min="10" max="90" value="50" class="slider">
                    <span class="slider-value" id="decay-value">0.50</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">波纹强度</label>
                <div class="slider-container">
                    <input type="range" id="intensity" min="20" max="100" value="60" class="slider">
                    <span class="slider-value" id="intensity-value">60</span>
                </div>
            </div>

            <div class="color-palette">
                <button class="color-btn active" data-palette="ocean" aria-label="深海配色">
                    <span class="color-preview ocean"></span>
                    <span class="color-name">深海</span>
                </button>
                <button class="color-btn" data-palette="aurora" aria-label="极光配色">
                    <span class="color-preview aurora"></span>
                    <span class="color-name">极光</span>
                </button>
                <button class="color-btn" data-palette="sakura" aria-label="樱落配色">
                    <span class="color-preview sakura"></span>
                    <span class="color-name">樱落</span>
                </button>
                <button class="color-btn" data-palette="midnight" aria-label="午夜配色">
                    <span class="color-preview midnight"></span>
                    <span class="color-name">午夜</span>
                </button>
            </div>

            <div class="action-buttons">
                <button class="action-btn" id="clear-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                    </svg>
                    <span>清除</span>
                </button>
                <button class="action-btn primary" id="fullscreen-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
                    </svg>
                    <span>全屏</span>
                </button>
            </div>
        </section>

        <footer class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">FPS</span>
                <span class="stat-value" id="fps-display">60</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">波纹</span>
                <span class="stat-value" id="ripple-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">触点</span>
                <span class="stat-value" id="touch-count">0</span>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
