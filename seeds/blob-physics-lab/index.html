<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blob Physics Lab 液滴物理实验室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <main class="app-shell">
        <header class="panel-header glass">
            <div class="brand-group">
                <h1 class="brand-title">Blob<span class="brand-dot">.</span>Physics<span class="brand-dot">.</span>Lab</h1>
                <p class="brand-subtitle">软体液滴物理实验室 · 按压 · 拖拽 · 融合</p>
            </div>
            <div class="header-actions">
                <div class="mode-toggle" role="group" aria-label="物理模式">
                    <button class="mode-btn active" data-physics="float" title="悬浮模式">Float</button>
                    <button class="mode-btn" data-physics="gravity" title="重力模式">Gravity</button>
                    <button class="mode-btn" data-physics="zero" title="零重力">Zero-G</button>
                </div>
            </div>
        </header>

        <section class="stage-area glass" id="stage-area">
            <canvas id="blob-canvas"></canvas>
            <div class="stage-hint" id="stage-hint">
                <span class="hint-line">点击空白处 孕育液滴</span>
                <span class="hint-sep">·</span>
                <span class="hint-line">按住液滴 拖拽揉捏</span>
                <span class="hint-sep">·</span>
                <span class="hint-line">双击液滴 令其炸裂</span>
            </div>
            <div class="telemetry" id="telemetry">
                <span class="tele-item">BLOBS <b id="tele-blobs">0</b></span>
                <span class="tele-item">ENERGY <b id="tele-energy">0.00</b></span>
                <span class="tele-item">FPS <b id="tele-fps">60</b></span>
            </div>
            <div class="ripple-pulse" id="ripple-layer" aria-hidden="true"></div>
        </section>

        <aside class="control-rail">
            <div class="control-card glass">
                <h2 class="control-title">Physics</h2>
                <label class="slider-row">
                    <span class="slider-label">Gravity</span>
                    <input type="range" id="slider-gravity" min="0" max="1.2" step="0.01" value="0">
                    <b class="slider-value" id="value-gravity">0.00</b>
                </label>
                <label class="slider-row">
                    <span class="slider-label">Softness</span>
                    <input type="range" id="slider-softness" min="0.5" max="2" step="0.05" value="1">
                    <b class="slider-value" id="value-softness">1.00</b>
                </label>
                <label class="slider-row">
                    <span class="slider-label">Damping</span>
                    <input type="range" id="slider-damping" min="0.90" max="0.999" step="0.001" value="0.985">
                    <b class="slider-value" id="value-damping">0.985</b>
                </label>
            </div>

            <div class="control-card glass">
                <h2 class="control-title">Palette</h2>
                <div class="palette-row" id="palette-row">
                    <button class="palette-dot active" data-theme="nebula" style="--dot: #7c6cff" title="星云"></button>
                    <button class="palette-dot" data-theme="lagoon" style="--dot: #2dd4bf" title="潟湖"></button>
                    <button class="palette-dot" data-theme="ember" style="--dot: #fb7185" title="余烬"></button>
                    <button class="palette-dot" data-theme="aurora" style="--dot: #a3e635" title="极光"></button>
                </div>
            </div>

            <div class="control-card glass">
                <h2 class="control-title">Actions</h2>
                <div class="action-row">
                    <button class="action-btn" id="btn-spawn">+ Spawn</button>
                    <button class="action-btn" id="btn-pop">Pop All</button>
                    <button class="action-btn danger" id="btn-reset">Reset</button>
                </div>
            </div>
        </aside>
    </main>

    <script src="main.js"></script>
</body>
</html>
