<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Math Owl — 像素数枭心算舱</title>
    <meta name="description" content="沉浸式像素数学猫头鹰心算舱。弹簧物理像素矩阵猫头鹰实时解构与重组——答对即刻像素迸散重聚、答错共振颤抖，乱码揭示题目、连击星火、XP 星轨与羽毛飘落，流体渐变背景 + 微晶玻璃态容器，4种氛围配色">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070b16'/%3E%3Cg fill='%23ffb347'%3E%3Crect x='14' y='10' width='6' height='6'/%3E%3Crect x='44' y='10' width='6' height='6'/%3E%3Crect x='12' y='16' width='40' height='24'/%3E%3Crect x='20' y='40' width='24' height='6'/%3E%3C/g%3E%3Cg fill='%23070b16'%3E%3Crect x='19' y='20' width='8' height='8'/%3E%3Crect x='37' y='20' width='8' height='8'/%3E%3Crect x='29' y='30' width='6' height='6'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="palette-aurora">
    <!-- === Fluid Mesh Background === -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="grain"></div>
    </div>

    <!-- Ambient Particle Layer -->
    <canvas class="particle-layer" id="particle-layer" aria-hidden="true"></canvas>

    <!-- Cursor Glow -->
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <a href="../../index.html" class="back-link" aria-label="返回数字花园">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <!-- === Header === -->
        <header class="panel-header glass-panel">
            <div class="brand-group">
                <div class="brand-mark" aria-hidden="true">
                    <span class="mark-pixel"></span>
                    <span class="mark-pixel"></span>
                    <span class="mark-pixel"></span>
                    <span class="mark-pixel"></span>
                </div>
                <div class="brand-text">
                    <h1 class="brand-title">Pixel<span class="brand-dot">·</span>Math<span class="brand-dot">·</span>Owl</h1>
                    <p class="brand-subtitle">像素数枭心算舱 — 答案即像素的呼吸</p>
                </div>
            </div>
            <div class="palette-switch" role="radiogroup" aria-label="氛围配色">
                <button class="palette-btn is-active" data-palette="aurora" role="radio" aria-checked="true" title="极光"></button>
                <button class="palette-btn" data-palette="cyber" role="radio" aria-checked="false" title="赛博"></button>
                <button class="palette-btn" data-palette="dusk" role="radio" aria-checked="false" title="暮砂"></button>
                <button class="palette-btn" data-palette="mint" role="radio" aria-checked="false" title="薄荷"></button>
            </div>
        </header>

        <main class="stage">
            <!-- === Owl Observatory (Pixel Matrix Canvas) === -->
            <section class="owl-panel glass-panel">
                <div class="owl-scene" id="owl-scene">
                    <div class="owl-moon" aria-hidden="true"></div>
                    <div class="owl-stars" aria-hidden="true" id="owl-stars"></div>
                    <canvas class="owl-canvas" id="owl-canvas" aria-label="像素猫头鹰导师"></canvas>
                    <div class="owl-speech glass-speech" id="owl-speech" aria-live="polite">
                        <span id="owl-speech-text">hoot! 吾即是数学，数学即是吾。</span>
                    </div>
                </div>
                <div class="owl-hud">
                    <div class="hud-cell">
                        <span class="hud-label">LV</span>
                        <span class="hud-value" id="hud-level">1</span>
                    </div>
                    <div class="hud-cell">
                        <span class="hud-label">COMBO</span>
                        <span class="hud-value hud-combo" id="hud-combo">×0</span>
                    </div>
                    <div class="hud-cell">
                        <span class="hud-label">ACC</span>
                        <span class="hud-value" id="hud-accuracy">--%</span>
                    </div>
                    <div class="hud-cell">
                        <span class="hud-label">BEST</span>
                        <span class="hud-value" id="hud-best">×0</span>
                    </div>
                </div>
                <div class="xp-track" aria-hidden="true">
                    <div class="xp-ring-wrap">
                        <svg class="xp-ring" viewBox="0 0 72 72">
                            <circle class="xp-ring-bg" cx="36" cy="36" r="30"></circle>
                            <circle class="xp-ring-fill" id="xp-ring-fill" cx="36" cy="36" r="30"></circle>
                        </svg>
                        <span class="xp-ring-text" id="xp-ring-text">0<span>/100</span></span>
                    </div>
                    <div class="xp-meta">
                        <p class="xp-title">智者星轨</p>
                        <p class="xp-sub" id="xp-sub">再答对 10 题晋级 Lv.2</p>
                    </div>
                </div>
            </section>

            <!-- === Quiz Console === -->
            <section class="quiz-panel glass-panel">
                <div class="console-tabs" role="tablist" aria-label="运算模式">
                    <button class="tab-btn is-active" data-mode="add" role="tab" aria-selected="true">＋ 加法</button>
                    <button class="tab-btn" data-mode="sub" role="tab" aria-selected="false">－ 减法</button>
                    <button class="tab-btn" data-mode="mul" role="tab" aria-selected="false">× 乘法</button>
                    <button class="tab-btn" data-mode="div" role="tab" aria-selected="false">÷ 除法</button>
                    <button class="tab-btn" data-mode="mix" role="tab" aria-selected="false">∑ 混合</button>
                </div>

                <div class="difficulty-row" role="radiogroup" aria-label="难度">
                    <span class="diff-label">难度</span>
                    <button class="diff-btn" data-diff="1" role="radio" aria-checked="false">I</button>
                    <button class="diff-btn is-active" data-diff="2" role="radio" aria-checked="true">II</button>
                    <button class="diff-btn" data-diff="3" role="radio" aria-checked="false">III</button>
                    <button class="diff-btn" data-diff="4" role="radio" aria-checked="false">IV</button>
                </div>

                <div class="question-card" id="question-card">
                    <p class="question-eyebrow" id="question-eyebrow">QUEST №1 · ADDITION</p>
                    <h2 class="question-text" id="question-text">7 + 5 = ?</h2>
                </div>

                <div class="answer-row">
                    <div class="answer-field" id="answer-field">
                        <input type="text" id="answer-input" class="answer-input" inputmode="numeric" autocomplete="off" placeholder="?" aria-label="你的答案" maxlength="8">
                        <button class="answer-submit" id="answer-submit" aria-label="提交答案">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14M13 6l6 6-6 6"/>
                            </svg>
                        </button>
                    </div>
                    <button class="skip-btn" id="skip-btn">跳过 →</button>
                </div>

                <div class="numpad" aria-label="数字键盘">
                    <button class="num-key" data-key="7">7</button>
                    <button class="num-key" data-key="8">8</button>
                    <button class="num-key" data-key="9">9</button>
                    <button class="num-key" data-key="4">4</button>
                    <button class="num-key" data-key="5">5</button>
                    <button class="num-key" data-key="6">6</button>
                    <button class="num-key" data-key="1">1</button>
                    <button class="num-key" data-key="2">2</button>
                    <button class="num-key" data-key="3">3</button>
                    <button class="num-key" data-key="0">0</button>
                    <button class="num-key num-key-minus" data-key="-">±</button>
                    <button class="num-key num-key-back" data-key="back" aria-label="退格">⌫</button>
                </div>

                <div class="feedback-strip" id="feedback-strip" aria-live="polite"></div>
            </section>
        </main>

        <footer class="panel-footer">
            <p class="footer-hint">ENTER 提交 · 悬停猫头鹰撩动羽毛 · 点击场景触发像素涟漪</p>
            <p class="footer-sig">seed <span class="sig-accent">pixel-math-owl</span> · maintained by EDEN</p>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
