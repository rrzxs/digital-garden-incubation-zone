<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT Wall Gallery — 显像管画廊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-0">

    <!-- 流体网格渐变背景 -->
    <div class="mesh-bg">
        <div class="mesh-orb mesh-orb-1"></div>
        <div class="mesh-orb mesh-orb-2"></div>
        <div class="mesh-orb mesh-orb-3"></div>
        <div class="mesh-orb mesh-orb-4"></div>
    </div>

    <canvas id="ambient-canvas"></canvas>
    <div class="noise-overlay"></div>

    <!-- 头部 -->
    <header class="site-header">
        <div class="header-title">
            <span class="header-icon">▣</span>
            <h1>CRT Wall Gallery</h1>
        </div>
        <p class="header-sub">显像管画廊 — 八台老式显示器，八个永不停播的信号频道</p>
    </header>

    <!-- 控制台 -->
    <div class="control-deck glass">
        <button class="ctl-btn" id="btn-power" title="整机电源">
            <span class="ctl-icon">⏻</span><span class="ctl-label">POWER</span>
        </button>
        <button class="ctl-btn" id="btn-shuffle" title="随机换台">
            <span class="ctl-icon">⤨</span><span class="ctl-label">SHUFFLE</span>
        </button>
        <button class="ctl-btn" id="btn-theme" title="切换配色">
            <span class="ctl-icon">◐</span><span class="ctl-label" id="theme-label">PHOSPHOR</span>
        </button>
        <div class="ctl-slider">
            <span class="ctl-icon">▤</span>
            <input type="range" id="scan-slider" min="0" max="100" value="55" title="扫描线强度">
        </div>
    </div>

    <!-- 显示器墙 -->
    <main class="wall" id="wall"></main>

    <!-- 聚焦剧场 -->
    <div class="focus-overlay" id="focus-overlay" aria-hidden="true">
        <div class="focus-stage">
            <figure class="crt focus-crt glass-strong">
                <div class="crt-screen-wrap">
                    <canvas class="crt-screen" id="focus-canvas" width="480" height="360"></canvas>
                </div>
                <figcaption class="crt-caption">
                    <span class="crt-ch-label" id="focus-ch-label">CH-01 PLASMA</span>
                    <span class="crt-hint">← → 切换频道 · ESC 关闭</span>
                </figcaption>
            </figure>
            <div class="focus-controls">
                <button class="ctl-btn" id="btn-prev-ch">← PREV</button>
                <button class="ctl-btn" id="btn-next-ch">NEXT →</button>
                <button class="ctl-btn" id="btn-close-focus">✕ CLOSE</button>
            </div>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar glass-subtle">
        <div class="status-left">
            <span class="status-indicator" id="status-indicator"></span>
            <span id="status-on">8/8 ON</span>
        </div>
        <div class="status-center">
            <span>SIGNAL LOCKED · 30 FPS · CH-SCAN ACTIVE</span>
        </div>
        <div class="status-right">
            <span id="status-fps">30 FPS</span>
            <span class="status-sep">|</span>
            <span>eden.broadcast</span>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
