<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Cascade 级联单元 - 级联微交互体验</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <main class="app-shell">
        <header class="panel-header">
            <div class="brand-group">
                <h1 class="brand-title">Unit Cascade<span class="brand-dot">.</span></h1>
                <p class="brand-subtitle">级联微交互体验场</p>
            </div>
            <div class="header-actions">
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="cascade" aria-label="级联模式">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="5" y="10" width="14" height="4" rx="1"/><rect x="8" y="17" width="8" height="4" rx="1"/></svg>
                    </button>
                    <button class="mode-btn" data-mode="field" aria-label="力场模式">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="4 3"/></svg>
                    </button>
                    <button class="mode-btn" data-mode="wave" aria-label="波浪模式">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <section class="stage-area" id="stage-area">
            <canvas id="cascade-canvas"></canvas>

            <div class="stage-hint" id="stage-hint">
                <span class="hint-dot"></span>
                <span class="hint-text">点击画布 · 触发级联坍缩</span>
            </div>

            <div class="stats-overlay" id="stats-overlay">
                <div class="stat-item">
                    <span class="stat-label">UNITS</span>
                    <span class="stat-value" id="stat-units">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">CASCADES</span>
                    <span class="stat-value" id="stat-cascades">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">ENERGY</span>
                    <span class="stat-value" id="stat-energy">0.00</span>
                </div>
            </div>
        </section>

        <footer class="controls-bar">
            <div class="control-group">
                <label class="control-label">重力</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-gravity" min="5" max="40" value="18" class="slider">
                    <span class="slider-val" id="val-gravity">0.18</span>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">级联力</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-cascade" min="20" max="100" value="55" class="slider">
                    <span class="slider-val" id="val-cascade">0.55</span>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">弹性</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-bounce" min="20" max="85" value="55" class="slider">
                    <span class="slider-val" id="val-bounce">0.55</span>
                </div>
            </div>

            <div class="palette-group">
                <button class="palette-btn active" data-palette="obsidian" aria-label="黑曜石">
                    <span class="swatch" style="background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899)"></span>
                </button>
                <button class="palette-btn" data-palette="aurora" aria-label="极光">
                    <span class="swatch" style="background:linear-gradient(135deg,#00d4ff,#a855f7,#00ff88)"></span>
                </button>
                <button class="palette-btn" data-palette="ember" aria-label="余烬">
                    <span class="swatch" style="background:linear-gradient(135deg,#f97316,#ef4444,#fbbf24)"></span>
                </button>
                <button class="palette-btn" data-palette="frost" aria-label="霜降">
                    <span class="swatch" style="background:linear-gradient(135deg,#67e8f9,#a5b4fc,#e0e7ff)"></span>
                </button>
            </div>

            <div class="action-group">
                <button class="action-btn" id="btn-drop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                    <span>投放</span>
                </button>
                <button class="action-btn" id="btn-trigger">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>
                    <span>脉冲</span>
                </button>
                <button class="action-btn" id="btn-reset">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>重置</span>
                </button>
                <button class="action-btn primary" id="btn-fullscreen">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    <span>全屏</span>
                </button>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
