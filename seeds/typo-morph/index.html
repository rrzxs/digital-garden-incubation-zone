<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typo Morph — 字形流变实验室</title>
    <meta name="description" content="沉浸式字形流变交互体验。输入文字，观察字符在五种变形场中实时流变：弹性、晶格、漩涡、脉动、碎裂，配合粒子流场与微晶玻璃态容器">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23080814'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='26' font-family='monospace' fill='%23f0abfc'%3ETM%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas class="particle-layer" id="particle-layer"></canvas>

    <div class="cursor-glow" id="cursor-glow"></div>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <header class="panel-header glass-panel">
            <div class="brand-group">
                <h1 class="brand-title">Typo<span class="brand-dot">.</span>Morph</h1>
                <p class="brand-subtitle">字形流变实验室 — 字符的非线性形变空间</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-shuffle" aria-label="随机变形" title="随机变形 (S)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="icon-btn" id="btn-explode" aria-label="爆炸脉冲" title="爆炸脉冲 (Space)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                </button>
                <button class="icon-btn" id="btn-reset" aria-label="重置参数" title="重置参数 (R)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
            </div>
        </header>

        <section class="stage" id="stage">
            <div class="stage-inner" id="stage-inner">
                <div class="typo-canvas glass-panel" id="typo-canvas">
                    <div class="typo-display" id="typo-display"></div>
                    <div class="canvas-rings" id="canvas-rings"></div>
                </div>
                <div class="char-meta" id="char-meta"></div>
            </div>
        </section>

        <footer class="controls-bar glass-panel">
            <div class="controls-scroll">
                <div class="ctrl-group">
                    <label class="ctrl-label">输入文字</label>
                    <div class="text-input-wrap">
                        <input type="text" id="input-text" class="text-input" value="Typo Morph" maxlength="30" placeholder="输入任意文字...">
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字号 <span class="ctrl-value" id="val-size">80</span></label>
                    <input type="range" id="ctrl-size" class="range-input" min="32" max="160" value="80">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字重 <span class="ctrl-value" id="val-weight">300</span></label>
                    <input type="range" id="ctrl-weight" class="range-input" min="100" max="900" value="300" step="100">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">变形模式</label>
                    <div class="mode-toggle" id="mode-toggle">
                        <button class="mode-btn active" data-mode="elastic" aria-label="弹性模式">Elastic</button>
                        <button class="mode-btn" data-mode="crystal" aria-label="晶格模式">Crystal</button>
                        <button class="mode-btn" data-mode="vortex" aria-label="漩涡模式">Vortex</button>
                        <button class="mode-btn" data-mode="pulse" aria-label="脉动模式">Pulse</button>
                        <button class="mode-btn" data-mode="shatter" aria-label="碎裂模式">Shatter</button>
                    </div>
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">强度 <span class="ctrl-value" id="val-amplitude">55</span></label>
                    <input type="range" id="ctrl-amplitude" class="range-input" min="0" max="100" value="55">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">速度 <span class="ctrl-value" id="val-speed">45</span></label>
                    <input type="range" id="ctrl-speed" class="range-input" min="0" max="100" value="45">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">光标力场</label>
                    <div class="field-toggle" id="field-toggle">
                        <button class="mode-btn active" data-field="repel" aria-label="排斥">Repel</button>
                        <button class="mode-btn" data-field="attract" aria-label="吸引">Attract</button>
                        <button class="mode-btn" data-field="orbit" aria-label="环绕">Orbit</button>
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">氛围配色</label>
                    <div class="palette-toggle" id="palette-toggle">
                        <button class="palette-btn active" data-palette="nebula" aria-label="星云">
                            <span class="swatch" style="background: linear-gradient(135deg, #f0abfc, #818cf8)"></span>
                        </button>
                        <button class="palette-btn" data-palette="solar" aria-label="日珥">
                            <span class="swatch" style="background: linear-gradient(135deg, #fbbf24, #f97316)"></span>
                        </button>
                        <button class="palette-btn" data-palette="ocean" aria-label="深海">
                            <span class="swatch" style="background: linear-gradient(135deg, #22d3ee, #3b82f6)"></span>
                        </button>
                        <button class="palette-btn" data-palette="void" aria-label="虚空">
                            <span class="swatch" style="background: linear-gradient(135deg, #94a3b8, #475569)"></span>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
