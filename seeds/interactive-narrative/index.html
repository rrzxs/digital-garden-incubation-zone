<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Narrative | 回声残响</title>
    <meta name="description" content="A branching, choice-driven interactive story. Your decisions rewrite the world's color, its cadence, and the shape of the constellation you leave behind.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- === AMBIENT FLUID BACKGROUND === -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="gradient-orb orb-a"></div>
        <div class="gradient-orb orb-b"></div>
        <div class="gradient-orb orb-c"></div>
        <div class="gradient-orb orb-d"></div>
        <canvas class="flow-field" id="flow-field"></canvas>
        <div class="grain-layer"></div>
        <div class="vignette-layer"></div>
    </div>

    <!-- === BACK LINK === -->
    <a href="../../index.html" class="back-link" aria-label="返回数字花园">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回集木区</span>
    </a>

    <!-- === TOP HUD === -->
    <header class="hud-top">
        <div class="hud-brand">
            <span class="brand-mark" aria-hidden="true">◐</span>
            <div class="brand-text">
                <span class="brand-title">Echoes</span>
                <span class="brand-sub">回声残响 · interactive narrative</span>
            </div>
        </div>
        <div class="hud-meta">
            <div class="hud-cell">
                <span class="hud-label">CHAPTER</span>
                <span class="hud-value" id="hud-chapter">00</span>
            </div>
            <div class="hud-divider" aria-hidden="true"></div>
            <div class="hud-cell">
                <span class="hud-label">MOOD</span>
                <span class="hud-value" id="hud-mood">dormant</span>
            </div>
            <div class="hud-divider" aria-hidden="true"></div>
            <div class="hud-cell">
                <span class="hud-label">DEPTH</span>
                <span class="hud-value" id="hud-depth">0</span>
            </div>
        </div>
    </header>

    <!-- === PATH CONSTELLATION (right rail) === -->
    <aside class="constellation" id="constellation" aria-label="路径星图">
        <svg class="constellation-svg" id="constellation-svg" viewBox="0 0 100 600" preserveAspectRatio="none"></svg>
        <div class="constellation-readout">
            <span class="readout-label">PATH</span>
            <span class="readout-value" id="readout-value">—</span>
        </div>
    </aside>

    <!-- === NARRATIVE STAGE === -->
    <main class="stage" id="stage">

        <!-- Chapter meta strip -->
        <div class="chapter-strip glass-panel" id="chapter-strip">
            <span class="strip-number" id="strip-number">001</span>
            <span class="strip-divider" aria-hidden="true">//</span>
            <span class="strip-label" id="strip-label">DORMANT</span>
            <span class="strip-spacer"></span>
            <span class="strip-coord" id="strip-coord">N 00.00 · E 00.00</span>
        </div>

        <!-- Narrative body -->
        <section class="narrative glass-panel" id="narrative-panel">
            <div class="narrative-prelude" id="narrative-prelude">
                <span class="prelude-tag">SIGNAL</span>
                <span class="prelude-text" id="prelude-text">incoming…</span>
            </div>
            <h1 class="narrative-title" id="narrative-title">
                <span class="title-fragment" data-i="0"></span><span class="title-cursor" aria-hidden="true"></span>
            </h1>
            <div class="narrative-body" id="narrative-body" aria-live="polite"></div>
        </section>

        <!-- Choices -->
        <section class="choices" id="choices" aria-label="选择"></section>

        <!-- Reset / epilogue -->
        <div class="stage-footer">
            <button class="ghost-btn" id="restart-btn" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 4v6h6M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                </svg>
                <span>从起点重启</span>
            </button>
            <span class="footer-hint">按数字键 1 / 2 / 3 选择 · ← 退回上一节点</span>
        </div>

    </main>

    <!-- === BOTTOM TELEMTRY === -->
    <footer class="hud-bottom">
        <div class="telemetry-block">
            <span class="tel-label">CADENCE</span>
            <div class="cadence-bar"><div class="cadence-fill" id="cadence-fill"></div></div>
        </div>
        <div class="telemetry-block telemetry-right">
            <span class="tel-label">DECISIONS</span>
            <span class="tel-value" id="tel-decisions">0 / ∞</span>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
