<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive Index Player · 档案索引播放器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="noir">
  <!-- ══════════ 流体渐变背景 ══════════ -->
  <div class="mesh-bg" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="blob blob-d"></div>
  </div>
  <canvas id="field-canvas" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <!-- ══════════ 应用容器 ══════════ -->
  <main class="app" role="main">
    <!-- ── 顶栏 ── -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-sigil">▦</span>
        <div class="brand-text">
          <h1 class="brand-title">ARCHIVE·INDEX·PLAYER</h1>
          <p class="brand-sub">档案索引播放器 — 卷宗即唱片</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="theme-dots" id="theme-dots" role="radiogroup" aria-label="氛围配色"></div>
        <div class="clock" id="hud-clock">00:00:00</div>
      </div>
    </header>

    <!-- ── 主体双栏 ── -->
    <section class="stage-wrap">
      <!-- 索引列表 -->
      <aside class="index-panel glass" id="index-panel" aria-label="档案索引">
        <div class="panel-head">
          <span class="panel-label">INDEX / 索引</span>
          <span class="panel-count" id="entry-count">00 ENTRIES</span>
        </div>
        <nav class="index-list" id="index-list"></nav>
        <div class="panel-foot">
          <span class="hint-key">↑↓</span> 导航
          <span class="hint-key">SPACE</span> 播放
          <span class="hint-key">T</span> 配色
        </div>
      </aside>

      <!-- 播放舞台 -->
      <section class="player-stage glass">
        <!-- 卷轴装饰 -->
        <div class="reels" aria-hidden="true">
          <div class="reel" id="reel-l"><i></i><i></i><i></i></div>
          <div class="reel" id="reel-r"><i></i><i></i><i></i></div>
        </div>

        <div class="stage-meta">
          <span class="entry-code" id="entry-code">AR-0000</span>
          <span class="entry-dot"></span>
          <span class="entry-cat" id="entry-cat">—</span>
          <span class="entry-year" id="entry-year">—</span>
          <span class="entry-state" id="entry-state">STANDBY</span>
        </div>

        <h2 class="entry-title" id="entry-title">正在唤醒档案……</h2>
        <p class="entry-desc" id="entry-desc">索引检索中，请稍候。</p>

        <!-- 波形示波 -->
        <canvas id="wave-canvas" class="wave-canvas" aria-hidden="true"></canvas>

        <!-- 进度轨道 -->
        <div class="progress-zone">
          <span class="time-now" id="time-now">00:00.0</span>
          <div class="progress-track" id="progress-track" role="slider" aria-label="播放进度" tabindex="0">
            <div class="progress-buffer" id="progress-buffer"></div>
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-thumb" id="progress-thumb"></div>
          </div>
          <span class="time-total" id="time-total">00:00.0</span>
        </div>

        <!-- 传输控制 -->
        <div class="transport">
          <button class="t-btn" id="btn-prev" title="上一卷 (←)" aria-label="上一卷">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button class="t-btn t-play" id="btn-play" title="播放/暂停 (SPACE)" aria-label="播放或暂停">
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="t-btn" id="btn-next" title="下一卷 (→)" aria-label="下一卷">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
          <div class="transport-sep"></div>
          <button class="t-btn" id="btn-shuffle" title="随机抽卷" aria-label="随机抽卷">
            <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8.5h-2.6l-2.1 2.8-1.5-2 2.3-3.1c.3-.4.7-.6 1.2-.6H17V3zM3 7h4.5c.5 0 1 .2 1.3.7l7 9.3c.3.4.7.6 1.2.6H17V14l4 4-4 4v-2h-1c-1.1 0-2.2-.5-2.8-1.4L6.6 9.6c-.3-.4-.7-.6-1.1-.6H3V7zm7.3 7.2l1.5 2-1.6 2.1c-.6.9-1.7 1.4-2.8 1.4H3v-2h2.4c.5 0 .9-.2 1.2-.6l2.7-2.9z"/></svg>
          </button>
          <button class="t-btn t-toggle" id="btn-auto" title="连续播放" aria-label="连续播放">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <span class="t-badge" id="auto-badge">AUTO</span>
          </button>
          <button class="t-btn t-toggle" id="btn-mute" title="索引音色" aria-label="索引音色">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <span class="t-badge" id="mute-badge">SFX ON</span>
          </button>
        </div>
      </section>
    </section>

    <!-- 底部状态条 -->
    <footer class="statusbar">
      <span id="status-left">ARCHIVE READY</span>
      <span class="status-sep"></span>
      <span id="status-right">MAINTAINED BY EDEN</span>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
