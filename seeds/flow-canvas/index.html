<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Canvas — 流体画布</title>
    <meta name="description" content="沉浸式流体画布交互体验。Simplex 噪声流场驱动的粒子绘画系统，鼠标力场扰动，4种流场模式 × 5种画笔风格 × 4种氛围配色">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a12'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='26' font-family='monospace' fill='%23c4b5fd'%3EFc%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <header class="panel-header glass-panel">
            <div class="brand-group">
                <h1 class="brand-title">Flow<span class="brand-dot">.</span>Canvas</h1>
                <p class="brand-subtitle">流体画布实验室 — Simplex 噪声流场 × 粒子绘画</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-clear" aria-label="清空画布" title="清空画布">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg>
                </button>
                <button class="icon-btn" id="btn-shuffle" aria-label="随机化" title="随机化">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="icon-btn" id="btn-reset" aria-label="重置" title="重置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
            </div>
        </header>

        <section class="stage" id="stage">
            <canvas class="flow-canvas" id="flow-canvas"></canvas>
            <canvas class="paint-canvas" id="paint-canvas"></canvas>
            <div class="stage-overlay" id="stage-overlay">
                <div class="flow-hint" id="flow-hint">移动鼠标绘制流场轨迹 · 点击创建力场脉冲</div>
            </div>
            <div class="stage-stats" id="stage-stats">
                <span class="stat-item"><span class="stat-label">粒子</span><span class="stat-value" id="stat-particles">0</span></span>
                <span class="stat-item"><span class="stat-label">帧率</span><span class="stat-value" id="stat-fps">60</span></span>
            </div>
        </section>

        <aside class="controls-panel glass-panel">
            <div class="control-section">
                <h3 class="control-section-title">流场模式</h3>
                <div class="btn-group" id="flow-mode-group">
                    <button class="mode-btn active" data-mode="curl">旋度场</button>
                    <button class="mode-btn" data-mode="turbulence">湍流场</button>
                    <button class="mode-btn" data-mode="vortex">漩涡场</button>
                    <button class="mode-btn" data-mode="ridge">脊线场</button>
                </div>
            </div>

            <div class="control-section">
                <h3 class="control-section-title">画笔风格</h3>
                <div class="btn-group" id="brush-style-group">
                    <button class="mode-btn active" data-brush="ribbon">丝带</button>
                    <button class="mode-btn" data-brush="stardust">星尘</button>
                    <button class="mode-btn" data-brush="neon">霓虹</button>
                    <button class="mode-btn" data-brush="ink">水墨</button>
                    <button class="mode-btn" data-brush="ember">余烬</button>
                </div>
            </div>

            <div class="control-section">
                <h3 class="control-section-title">力场交互</h3>
                <div class="btn-group" id="force-mode-group">
                    <button class="mode-btn active" data-force="attract">吸引</button>
                    <button class="mode-btn" data-force="repel">排斥</button>
                    <button class="mode-btn" data-force="swirl">漩涡</button>
                </div>
            </div>

            <div class="control-section">
                <h3 class="control-section-title">氛围配色</h3>
                <div class="btn-group" id="theme-group">
                    <button class="mode-btn theme-btn active" data-theme="aurora"><span class="theme-dot" style="background:linear-gradient(135deg,#c4b5fd,#67e8f9)"></span>极光</button>
                    <button class="mode-btn theme-btn" data-theme="ember"><span class="theme-dot" style="background:linear-gradient(135deg,#fdba74,#f87171)"></span>焰火</button>
                    <button class="mode-btn theme-btn" data-theme="ocean"><span class="theme-dot" style="background:linear-gradient(135deg,#5eead4,#818cf8)"></span>深海</button>
                    <button class="mode-btn theme-btn" data-theme="neon"><span class="theme-dot" style="background:linear-gradient(135deg,#f0abfc,#38bdf8)"></span>霓虹</button>
                </div>
            </div>

            <div class="control-section">
                <h3 class="control-section-title">参数调节</h3>
                <div class="slider-group">
                    <label class="slider-label">
                        <span>粒子密度</span>
                        <span class="slider-value" id="val-density">3000</span>
                    </label>
                    <input type="range" class="slider" id="slider-density" min="500" max="8000" value="3000" step="100">
                </div>
                <div class="slider-group">
                    <label class="slider-label">
                        <span>流场强度</span>
                        <span class="slider-value" id="val-strength">1.0</span>
                    </label>
                    <input type="range" class="slider" id="slider-strength" min="0.1" max="3.0" value="1.0" step="0.1">
                </div>
                <div class="slider-group">
                    <label class="slider-label">
                        <span>流场演化</span>
                        <span class="slider-value" id="val-evolution">0.3</span>
                    </label>
                    <input type="range" class="slider" id="slider-evolution" min="0.0" max="1.0" value="0.3" step="0.05">
                </div>
                <div class="slider-group">
                    <label class="slider-label">
                        <span>笔触衰减</span>
                        <span class="slider-value" id="val-fade">0.02</span>
                    </label>
                    <input type="range" class="slider" id="slider-fade" min="0.005" max="0.1" value="0.02" step="0.005">
                </div>
                <div class="slider-group">
                    <label class="slider-label">
                        <span>力场半径</span>
                        <span class="slider-value" id="val-force-radius">120</span>
                    </label>
                    <input type="range" class="slider" id="slider-force-radius" min="40" max="300" value="120" step="10">
                </div>
            </div>
        </aside>
    </div>

    <script src="main.js"></script>
</body>
</html>
