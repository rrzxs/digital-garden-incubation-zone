<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Glyph Playground — 字形游乐场</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <main class="app-shell">
        <header class="panel-header">
            <div class="brand-group">
                <h1 class="brand-title">Font<span class="brand-dot">·</span>Glyph<span class="brand-fade"> Playground</span></h1>
                <p class="brand-subtitle">字形游乐场 — 字体的非线性形变实验场</p>
            </div>
            <div class="header-actions">
                <div class="preset-toggle" id="preset-toggle">
                    <button class="preset-btn active" data-preset="idle" aria-label="静止">
                        <span class="preset-label">Idle</span>
                    </button>
                    <button class="preset-btn" data-preset="breathe" aria-label="呼吸">
                        <span class="preset-label">Breathe</span>
                    </button>
                    <button class="preset-btn" data-preset="jitter" aria-label="抖动">
                        <span class="preset-label">Jitter</span>
                    </button>
                    <button class="preset-btn" data-preset="wave" aria-label="波浪">
                        <span class="preset-label">Wave</span>
                    </button>
                    <button class="preset-btn" data-preset="bounce" aria-label="弹跳">
                        <span class="preset-label">Bounce</span>
                    </button>
                </div>
            </div>
        </header>

        <section class="stage" id="stage">
            <canvas id="particle-canvas"></canvas>
            <div class="stage-vignette"></div>

            <div class="glyph-stage" id="glyph-stage" aria-live="polite">
                <!-- 字符 spans 在 main.js 中动态注入 -->
            </div>

            <div class="stage-hint" id="stage-hint">
                <span class="hint-dot"></span>
                <span class="hint-text">悬停字符 · 拖拽涂抹 · 感受字形呼吸</span>
            </div>

            <div class="mode-badge" id="mode-badge">
                <span class="mode-dot"></span>
                <span class="mode-text" id="mode-text">Smooth</span>
            </div>
        </section>

        <section class="text-input-row">
            <div class="input-shell">
                <span class="input-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                </span>
                <input type="text" id="text-input" class="text-input" maxlength="32" value="GLYPH" placeholder="输入文字 / type text…" autocomplete="off" spellcheck="false">
                <span class="input-count" id="input-count">5 / 32</span>
            </div>
        </section>

        <footer class="controls-bar">
            <div class="control-group" data-axis="weight">
                <label class="control-label">Weight 字重</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-weight" min="100" max="900" step="10" value="600" class="slider">
                    <span class="slider-val" id="val-weight">600</span>
                </div>
            </div>
            <div class="control-group" data-axis="width">
                <label class="control-label">Width 字宽</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-width" min="50" max="150" step="1" value="100" class="slider">
                    <span class="slider-val" id="val-width">1.00</span>
                </div>
            </div>
            <div class="control-group" data-axis="tracking">
                <label class="control-label">Tracking 字距</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-tracking" min="-10" max="40" step="1" value="2" class="slider">
                    <span class="slider-val" id="val-tracking">0.02</span>
                </div>
            </div>
            <div class="control-group" data-axis="slant">
                <label class="control-label">Slant 斜度</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-slant" min="-30" max="30" step="1" value="0" class="slider">
                    <span class="slider-val" id="val-slant">0°</span>
                </div>
            </div>
            <div class="control-group" data-axis="size">
                <label class="control-label">Size 字号</label>
                <div class="slider-wrap">
                    <input type="range" id="ctrl-size" min="40" max="180" step="1" value="120" class="slider">
                    <span class="slider-val" id="val-size">120</span>
                </div>
            </div>

            <div class="palette-group">
                <button class="palette-btn active" data-palette="void" aria-label="虚空">
                    <span class="swatch" style="background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899)"></span>
                </button>
                <button class="palette-btn" data-palette="jade" aria-label="翡翠">
                    <span class="swatch" style="background:linear-gradient(135deg,#10b981,#34d399,#6ee7b7)"></span>
                </button>
                <button class="palette-btn" data-palette="solar" aria-label="日蚀">
                    <span class="swatch" style="background:linear-gradient(135deg,#f59e0b,#ef4444,#f97316)"></span>
                </button>
                <button class="palette-btn" data-palette="arctic" aria-label="极地">
                    <span class="swatch" style="background:linear-gradient(135deg,#67e8f9,#a5b4fc,#e0e7ff)"></span>
                </button>
            </div>

            <div class="action-group">
                <button class="action-btn" id="btn-brush" title="切换涂抹模式">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
                    <span>涂抹</span>
                </button>
                <button class="action-btn" id="btn-shuffle" title="随机扰动字形">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                    <span>扰动</span>
                </button>
                <button class="action-btn primary" id="btn-reset" title="重置所有参数">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>重置</span>
                </button>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
