<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf · 灵感书架</title>
    <meta name="description" content="沉浸式灵感书架。3D 倾斜视差书脊、拖拽旋转、抽书展开、弹簧物理与微晶玻璃态容器，流体渐变背景 + 非线性动效，4种氛围配色">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link" aria-label="返回数字花园">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <!-- 流体网格渐变背景 -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
        <div class="grain"></div>
    </div>

    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <!-- 顶部控制条 -->
    <header class="topbar glass-bar">
        <div class="brand">
            <span class="brand-glyph">▤</span>
            <div class="brand-text">
                <span class="brand-title">Shelf</span>
                <span class="brand-sub">灵感书架 · 书脊叙事</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="hud" id="hud">
                <span class="hud-dot" id="hud-dot"></span>
                <span class="hud-text" id="hud-text">悬停或拖拽书脊</span>
            </div>
            <div class="palette-picker" role="group" aria-label="氛围配色">
                <button class="palette-dot active" data-palette="aurora" style="--dot:#7af0c8" title="极光 Aurora" aria-label="极光配色"></button>
                <button class="palette-dot" data-palette="ember"  style="--dot:#f0a07a" title="余烬 Ember" aria-label="余烬配色"></button>
                <button class="palette-dot" data-palette="abyss"  style="--dot:#7aa8f0" title="深渊 Abyss" aria-label="深渊配色"></button>
                <button class="palette-dot" data-palette="orchid" style="--dot:#b488f0" title="兰若 Orchid" aria-label="兰若配色"></button>
            </div>
        </div>
    </header>

    <!-- 主舞台 -->
    <main class="stage">
        <!-- 序言 -->
        <section class="preamble reveal">
            <span class="pre-tag">SHELF / VOL.IV</span>
            <h1 class="pre-title">
                <span class="pre-line">A library of</span>
                <span class="pre-line pre-italic">half-formed</span>
                <span class="pre-line">ideas.</span>
            </h1>
            <p class="pre-desc">每根书脊都是一个未完成的念头。悬停让它微微探出，拖拽让整排书在透视中流动。点击抽出一本，它会在微晶玻璃面板中翻开，讲述它的来历。</p>
        </section>

        <!-- 书架场景 -->
        <section class="shelf-stage" aria-label="3D 书架">
            <div class="shelf-tilt" id="shelf-tilt">
                <div class="shelf-rail" id="shelf-rail">
                    <!-- 书脊由 JS 注入 -->
                </div>
                <div class="shelf-board" aria-hidden="true"></div>
                <div class="shelf-board-shade" aria-hidden="true"></div>
            </div>
            <div class="shelf-scrollbar" aria-hidden="true">
                <div class="shelf-scrollbar-fill" id="scrollbar-fill"></div>
            </div>
        </section>

        <!-- 详情面板（抽书展开） -->
        <section class="detail-panel glass-bar" id="detail-panel" aria-hidden="true">
            <button class="detail-close" id="detail-close" aria-label="合上书本">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="detail-spine" id="detail-spine" aria-hidden="true">
                <span class="detail-spine-title" id="detail-spine-title"></span>
            </div>
            <div class="detail-body">
                <div class="detail-meta">
                    <span class="detail-tag" id="detail-tag"></span>
                    <span class="detail-idx" id="detail-idx"></span>
                </div>
                <h2 class="detail-title" id="detail-title"></h2>
                <div class="detail-author" id="detail-author"></div>
                <p class="detail-desc" id="detail-desc"></p>
                <div class="detail-stats" id="detail-stats"></div>
                <div class="detail-quote" id="detail-quote"></div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <span class="foot-text">Shelf · 灵感书架 · 由 <strong>EDEN</strong> 孵化</span>
        <span class="foot-count" id="foot-count">— 本 · 持续生长</span>
    </footer>

    <script src="main.js"></script>
</body>
</html>
