<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid 流体 - 交互式流体模拟体验</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回集木区</span>
    </a>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <main class="glass-container">
        <header class="panel-header">
            <h1 class="brand-title">Fluid.</h1>
            <p class="brand-subtitle">交互式流体模拟</p>
        </header>

        <section class="canvas-wrapper">
            <canvas id="fluid-canvas"></canvas>
            <div class="canvas-overlay">
                <span class="hint-text">移动鼠标或触摸屏幕</span>
            </div>
        </section>

        <section class="controls-panel">
            <div class="control-group">
                <label class="control-label">粘性系数</label>
                <div class="slider-container">
                    <input type="range" id="viscosity" min="0" max="100" value="20" class="slider">
                    <span class="slider-value" id="viscosity-value">0.20</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">扩散速度</label>
                <div class="slider-container">
                    <input type="range" id="diffusion" min="0" max="100" value="30" class="slider">
                    <span class="slider-value" id="diffusion-value">0.30</span>
                </div>
            </div>

            <div class="color-palette">
                <button class="color-btn active" data-palette="aurora" aria-label="极光配色">
                    <span class="color-preview aurora"></span>
                    <span class="color-name">极光</span>
                </button>
                <button class="color-btn" data-palette="sunset" aria-label="日落配色">
                    <span class="color-preview sunset"></span>
                    <span class="color-name">日落</span>
                </button>
                <button class="color-btn" data-palette="ocean" aria-label="深海配色">
                    <span class="color-preview ocean"></span>
                    <span class="color-name">深海</span>
                </button>
                <button class="color-btn" data-palette="neon" aria-label="霓虹配色">
                    <span class="color-preview neon"></span>
                    <span class="color-name">霓虹</span>
                </button>
            </div>

            <div class="action-buttons">
                <button class="action-btn" id="reset-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    <span>重置</span>
                </button>
                <button class="action-btn primary" id="fullscreen-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                    </svg>
                    <span>全屏</span>
                </button>
            </div>
        </section>

        <footer class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">FPS</span>
                <span class="stat-value" id="fps-display">60</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">粒子</span>
                <span class="stat-value" id="particle-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">密度</span>
                <span class="stat-value" id="density-display">128</span>
            </div>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
