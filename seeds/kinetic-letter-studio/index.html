<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Letter Studio — 动力学字符工作室</title>
    <meta name="description" content="沉浸式动力学字符工作室。输入文字，每个字符都是弹簧-阻尼物理实体——磁力、斥力、涡旋、重力四种力场驱动字符非线性运动，点击冲击波迸散、乱码揭示与粒子流场，流体渐变背景 + 微晶玻璃态容器">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070818'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='28' font-family='monospace' fill='%237dd3fc'%3EK%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-palette="aurora">
    <!-- 流体渐变背景 -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- 环境粒子流场 -->
    <canvas class="particle-layer" id="particle-layer" aria-hidden="true"></canvas>

    <!-- 光标辉光 -->
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-lineround="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <!-- 顶栏 -->
        <header class="panel-header glass-panel">
            <div class="brand-group">
                <h1 class="brand-title">Kinetic<span class="brand-dot">·</span>Letter<span class="brand-dot">·</span>Studio</h1>
                <p class="brand-subtitle">动力学字符工作室 — 每个字符都是一个弹簧振子</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-scatter" aria-label="冲击波迸散" title="冲击波迸散 (Space)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                </button>
                <button class="icon-btn" id="btn-shuffle" aria-label="随机重组" title="随机重组 (S)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="icon-btn" id="btn-reset" aria-label="复位归位" title="复位归位 (R)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
            </div>
        </header>

        <!-- 主舞台 -->
        <section class="stage glass-panel" id="stage">
            <div class="stage-vignette" aria-hidden="true"></div>
            <div class="letter-arena" id="letter-arena"></div>
            <div class="stage-hud">
                <span class="hud-chip" id="hud-mode">MODE: MAGNETIC</span>
                <span class="hud-chip" id="hud-count">GLYPHS: 0</span>
                <span class="hud-chip" id="hud-energy">ENERGY: 0%</span>
            </div>
            <div class="stage-hint" id="stage-hint">移动光标靠近字符 · 点击释放冲击波</div>
        </section>

        <!-- 控制台 -->
        <footer class="controls-bar glass-panel">
            <div class="controls-scroll">
                <div class="ctrl-group">
                    <label class="ctrl-label" for="input-text">输入文字</label>
                    <input type="text" id="input-text" class="text-input" value="KINETIC" maxlength="18" placeholder="输入任意文字..." autocomplete="off" spellcheck="false">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">力场模式</label>
                    <div class="mode-toggle" id="mode-toggle" role="group">
                        <button class="mode-btn active" data-mode="magnetic">Magnetic</button>
                        <button class="mode-btn" data-mode="repel">Repel</button>
                        <button class="mode-btn" data-mode="vortex">Vortex</button>
                        <button class="mode-btn" data-mode="gravity">Gravity</button>
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">力场强度 <span class="ctrl-value" id="val-force">60</span></label>
                    <input type="range" id="ctrl-force" class="range-input" min="10" max="100" value="60">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">弹簧刚度 <span class="ctrl-value" id="val-stiff">70</span></label>
                    <input type="range" id="ctrl-stiff" class="range-input" min="20" max="100" value="70">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">阻尼 <span class="ctrl-value" id="val-damp">50</span></label>
                    <input type="range" id="ctrl-damp" class="range-input" min="10" max="100" value="50">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字号 <span class="ctrl-value" id="val-size">84</span></label>
                    <input type="range" id="ctrl-size" class="range-input" min="40" max="150" value="84">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">氛围配色</label>
                    <div class="palette-toggle" id="palette-toggle" role="group">
                        <button class="palette-btn active" data-palette="aurora" aria-label="极光配色">Aurora</button>
                        <button class="palette-btn" data-palette="ember" aria-label="余烬配色">Ember</button>
                        <button class="palette-btn" data-palette="cyber" aria-label="赛博配色">Cyber</button>
                        <button class="palette-btn" data-palette="mono" aria-label="墨色配色">Mono</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
