<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Forge — 字形锻造</title>
    <meta name="description" content="沉浸式字形锻造实验室。输入文字，每个字符对光标产生弹簧物理响应。五种锻造模式实时形变字符，乱码揭示、脉冲冲击波与粒子流场。">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a12'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='34' font-family='Georgia, serif' font-weight='700' fill='%23c4b5fd'%3ET%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas class="particle-canvas" id="particle-canvas"></canvas>
    <div class="cursor-glow" id="cursor-glow"></div>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <header class="panel-header">
            <div class="brand-group">
                <div class="brand-mark" id="brand-mark">T</div>
                <div class="brand-text">
                    <h1 class="brand-title">Type<span class="brand-dot">·</span>Forge</h1>
                    <p class="brand-subtitle">字形锻造 — 弹簧物理驱动的实时排版锻造实验室</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="kbd-hint" id="kbd-hint">
                    <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span><span class="kbd">5</span>
                    <span class="kbd-label">模式</span>
                    <span class="kbd">Space</span><span class="kbd-label">脉冲</span>
                    <span class="kbd">R</span><span class="kbd-label">重置</span>
                </div>
                <button class="icon-btn" id="btn-pulse" aria-label="脉冲冲击波" title="脉冲冲击波 (Space)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" opacity="0.5"/><circle cx="12" cy="12" r="11" opacity="0.25"/></svg>
                </button>
                <button class="icon-btn" id="btn-reset" aria-label="重置参数" title="重置参数 (R)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
            </div>
        </header>

        <section class="stage" id="stage">
            <div class="forge-canvas glass-panel" id="forge-canvas">
                <div class="canvas-glow" id="canvas-glow"></div>
                <div class="forge-stage" id="forge-stage"></div>
            </div>

            <div class="telemetry glass-panel" id="telemetry">
                <div class="tele-row">
                    <span class="tele-label">FORGE</span>
                    <span class="tele-val" id="tele-forge">Magnetic</span>
                </div>
                <div class="tele-row">
                    <span class="tele-label">CHRS</span>
                    <span class="tele-val" id="tele-chrs">0</span>
                </div>
                <div class="tele-row">
                    <span class="tele-label">FORCE</span>
                    <span class="tele-val" id="tele-force">0.0</span>
                </div>
                <div class="tele-row">
                    <span class="tele-label">FPS</span>
                    <span class="tele-val" id="tele-fps">60</span>
                </div>
            </div>
        </section>

        <footer class="controls-bar glass-panel">
            <div class="controls-scroll">
                <div class="ctrl-group ctrl-grow">
                    <label class="ctrl-label">锻造文本</label>
                    <div class="text-input-wrap">
                        <input type="text" id="input-text" class="text-input" value="Forge" maxlength="24" placeholder="输入任意文字...">
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字号 <span class="ctrl-value" id="val-size">120</span></label>
                    <input type="range" id="ctrl-size" class="range-input" min="40" max="240" value="120">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字重 <span class="ctrl-value" id="val-weight">800</span></label>
                    <input type="range" id="ctrl-weight" class="range-input" min="100" max="900" value="800" step="100">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字距 <span class="ctrl-value" id="val-spacing">-0.03</span></label>
                    <input type="range" id="ctrl-spacing" class="range-input" min="-20" max="60" value="-3">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">锻造模式</label>
                    <div class="mode-toggle" id="mode-toggle">
                        <button class="mode-btn active" data-mode="magnetic" aria-label="磁力模式">Magnetic</button>
                        <button class="mode-btn" data-mode="repel" aria-label="排斥模式">Repel</button>
                        <button class="mode-btn" data-mode="wave" aria-label="波浪模式">Wave</button>
                        <button class="mode-btn" data-mode="glitch" aria-label="故障模式">Glitch</button>
                        <button class="mode-btn" data-mode="gravity" aria-label="引力模式">Gravity</button>
                    </div>
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">力场半径 <span class="ctrl-value" id="val-radius">200</span></label>
                    <input type="range" id="ctrl-radius" class="range-input" min="60" max="400" value="200">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">强度 <span class="ctrl-value" id="val-amplitude">65</span></label>
                    <input type="range" id="ctrl-amplitude" class="range-input" min="0" max="100" value="65">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">氛围配色</label>
                    <div class="palette-toggle" id="palette-toggle">
                        <button class="palette-btn active" data-palette="aurora" aria-label="极光">
                            <span class="swatch" style="background: linear-gradient(135deg, #c4b5fd, #67e8f9)"></span>
                        </button>
                        <button class="palette-btn" data-palette="ember" aria-label="烬火">
                            <span class="swatch" style="background: linear-gradient(135deg, #fda4af, #fdba74)"></span>
                        </button>
                        <button class="palette-btn" data-palette="forest" aria-label="森林">
                            <span class="swatch" style="background: linear-gradient(135deg, #86efac, #67e8f9)"></span>
                        </button>
                        <button class="palette-btn" data-palette="void" aria-label="虚空">
                            <span class="swatch" style="background: linear-gradient(135deg, #94a3b8, #e2e8f0)"></span>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
