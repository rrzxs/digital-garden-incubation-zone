<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinds Light Studio — 百叶窗光影工作室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grain"></div>
  </div>

  <div class="app">
    <!-- === Header === -->
    <header class="app-header glass">
      <div class="header-left">
        <span class="logo-icon">*=*=</span>
        <h1 class="logo-text">Blinds Light Studio</h1>
      </div>
      <div class="header-center">
        <span class="header-subtitle" id="mode-label">drag the stage to tilt the slats</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="theme-btn" aria-label="切换配色" title="切换配色">
          <span class="theme-dot"></span>
        </button>
      </div>
    </header>

    <!-- === Stage === -->
    <main class="stage-wrap">
      <section class="stage glass" id="stage">
        <canvas id="scene-canvas"></canvas>

        <!-- Window frame decoration -->
        <div class="window-frame" aria-hidden="true">
          <span class="frame-corner tl"></span>
          <span class="frame-corner tr"></span>
          <span class="frame-corner bl"></span>
          <span class="frame-corner br"></span>
        </div>

        <!-- Telemetry HUD -->
        <div class="hud glass-dark" id="hud">
          <div class="hud-row"><span class="hud-key">TILT</span><span class="hud-val" id="hud-tilt">+00.0°</span></div>
          <div class="hud-row"><span class="hud-key">APERTURE</span><span class="hud-val" id="hud-aperture">00%</span></div>
          <div class="hud-row"><span class="hud-key">LUX</span><span class="hud-val" id="hud-lux">0000</span></div>
          <div class="hud-row"><span class="hud-key">TIME</span><span class="hud-val" id="hud-time">12:00</span></div>
        </div>

        <div class="stage-hint" id="stage-hint">
          <span class="hint-line"></span>
          <span class="hint-text">DRAG ↕ TO TILT · CLICK TO SNAP</span>
          <span class="hint-line"></span>
        </div>
      </section>
    </main>

    <!-- === Control Deck === -->
    <nav class="control-deck glass" aria-label="控制台">
      <div class="ctrl-group">
        <label class="ctrl-label">TILT <span class="ctrl-value" id="tilt-readout">15°</span></label>
        <input type="range" id="tilt-slider" class="range" min="-80" max="80" value="15" step="0.5">
      </div>

      <div class="ctrl-group ctrl-grow">
        <label class="ctrl-label">TIME <span class="ctrl-value" id="time-readout">12:00</span></label>
        <input type="range" id="time-slider" class="range" min="0" max="24" value="12" step="0.1">
      </div>

      <div class="ctrl-group">
        <label class="ctrl-label">SLATS <span class="ctrl-value" id="slats-readout">14</span></label>
        <input type="range" id="slats-slider" class="range" min="6" max="26" value="14" step="1">
      </div>

      <button class="deck-btn" id="snap-btn">
        <span class="btn-glow"></span>
        <span class="btn-text">SNAP OPEN</span>
      </button>

      <button class="deck-btn deck-btn-ghost" id="breathe-btn">
        <span class="btn-dot" id="breathe-dot"></span>
        <span class="btn-text">BREATHE</span>
      </button>
    </nav>
  </div>

  <script src="main.js"></script>
</body>
</html>
