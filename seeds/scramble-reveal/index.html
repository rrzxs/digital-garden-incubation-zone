<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramble Reveal - 解密揭示</title>
    <meta name="description" content="沉浸式文字乱码揭示交互体验。字符从混沌中逐步解密浮现，5种揭示模式 × 4种氛围配色，粒子流场与微晶玻璃态容器">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a12'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='28' fill='%2300ffa3' font-family='monospace'%3E%3C/text%3E%3Ctext x='30' y='42' text-anchor='middle' font-size='28' fill='%2300ffa3' opacity='0.4' font-family='monospace'%3E%26%23xE002;%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <canvas class="particle-canvas" id="particle-canvas"></canvas>
        <div class="scanlines"></div>
    </div>

    <div class="app-container">
        <header class="header glass-panel">
            <div class="header-left">
                <span class="logo-icon">⟐</span>
                <h1 class="logo-text">SCRAMBLE REVEAL</h1>
            </div>
            <div class="header-right">
                <span class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">DECRYPTION ACTIVE</span>
                </span>
            </div>
        </header>

        <main class="main-content">
            <section class="display-section">
                <div class="reveal-container glass-panel" id="reveal-container">
                    <div class="reveal-stage" id="reveal-stage">
                        <div class="reveal-text" id="reveal-text"></div>
                        <div class="reveal-cursor" id="reveal-cursor"></div>
                    </div>
                    <div class="reveal-meta">
                        <span class="meta-item">MODE: <span id="current-mode">CASCADE</span></span>
                        <span class="meta-item">PROGRESS: <span id="progress-counter">0</span>%</span>
                        <span class="meta-item">CHARS: <span id="char-counter">0</span></span>
                    </div>
                </div>
            </section>

            <section class="controls-section glass-panel">
                <div class="control-group">
                    <label class="control-label">INPUT TEXT</label>
                    <div class="input-wrapper">
                        <input type="text" id="text-input" class="cyber-input" value="THE FUTURE IS NOW" maxlength="60" placeholder="Enter text to reveal...">
                        <span class="input-focus-line"></span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">REVEAL MODE</label>
                    <div class="mode-selector" id="mode-selector">
                        <button class="mode-btn active" data-mode="cascade">CASCADE</button>
                        <button class="mode-btn" data-mode="wave">WAVE</button>
                        <button class="mode-btn" data-mode="vortex">VORTEX</button>
                        <button class="mode-btn" data-mode="glitch">GLITCH</button>
                        <button class="mode-btn" data-mode="quantum">QUANTUM</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">SPEED</label>
                    <div class="slider-wrapper">
                        <input type="range" id="speed-slider" class="cyber-slider" min="1" max="100" value="50">
                        <span class="slider-value" id="speed-value">50</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">SCRAMBLE DENSITY</label>
                    <div class="slider-wrapper">
                        <input type="range" id="density-slider" class="cyber-slider" min="1" max="100" value="60">
                        <span class="slider-value" id="density-value">60</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">COLOR THEME</label>
                    <div class="theme-selector" id="theme-selector">
                        <button class="theme-btn active" data-theme="emerald" title="Emerald">
                            <span class="theme-swatch" style="background: linear-gradient(135deg, #00ffa3, #00d4ff)"></span>
                        </button>
                        <button class="theme-btn" data-theme="ember" title="Ember">
                            <span class="theme-swatch" style="background: linear-gradient(135deg, #ff6b35, #ffd700)"></span>
                        </button>
                        <button class="theme-btn" data-theme="arctic" title="Arctic">
                            <span class="theme-swatch" style="background: linear-gradient(135deg, #a78bfa, #60a5fa)"></span>
                        </button>
                        <button class="theme-btn" data-theme="plasma" title="Plasma">
                            <span class="theme-swatch" style="background: linear-gradient(135deg, #f472b6, #c084fc)"></span>
                        </button>
                    </div>
                </div>

                <div class="control-group action-row">
                    <button class="action-btn primary" id="btn-reveal">
                        <span class="btn-icon">▶</span>
                        <span class="btn-text">REVEAL</span>
                    </button>
                    <button class="action-btn secondary" id="btn-scramble">
                        <span class="btn-icon">⟲</span>
                        <span class="btn-text">SCRAMBLE</span>
                    </button>
                    <button class="action-btn secondary" id="btn-loop">
                        <span class="btn-icon">∞</span>
                        <span class="btn-text">LOOP</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
