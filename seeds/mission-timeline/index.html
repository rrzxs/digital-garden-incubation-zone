<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Timeline — 任务时间线</title>
    <meta name="description" content="沉浸式任务时间线体验。滚动驱动的非线性节点编排、流体渐变背景 + 微晶玻璃态容器 + 弹簧物理动效，让任务规划化为流动叙事">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a12'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='24' font-family='monospace' fill='%23c4b5fd'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <canvas class="particle-canvas" id="particle-canvas"></canvas>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <header class="panel-header glass-panel">
            <div class="brand-group">
                <h1 class="brand-title">Mission<span class="brand-dot">.</span>Timeline</h1>
                <p class="brand-subtitle">任务时间线 — 让每个里程碑化为流动叙事</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-add" aria-label="新建任务" title="新建任务">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button class="icon-btn" id="btn-shuffle" aria-label="随机" title="随机任务集">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="icon-btn" id="btn-reset" aria-label="重置" title="重置进度">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
            </div>
        </header>

        <section class="progress-stage glass-panel" id="progress-stage">
            <div class="progress-ring-wrap">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--accent-1)"/>
                            <stop offset="100%" stop-color="var(--accent-2)"/>
                        </linearGradient>
                    </defs>
                    <circle class="ring-track" cx="100" cy="100" r="86" />
                    <circle class="ring-fill" cx="100" cy="100" r="86" id="ring-fill" />
                </svg>
                <div class="progress-center">
                    <span class="progress-count" id="progress-count">0 / 0</span>
                    <span class="progress-label">已完成里程碑</span>
                </div>
            </div>
            <div class="stage-summary">
                <div class="summary-tag" id="summary-tag">MISSION ACTIVE</div>
                <h2 class="summary-title" id="summary-title">发起任务</h2>
                <p class="summary-desc" id="summary-desc">点击下方时间线节点，查看每个里程碑的详情。拖拽进度条或点击复选框完成任务，观察进度环的流动呼吸。</p>
                <div class="summary-meta">
                    <div class="meta-item">
                        <span class="meta-key">PROGRESS</span>
                        <span class="meta-val" id="meta-progress">0%</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-key">DURATION</span>
                        <span class="meta-val" id="meta-duration">--</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-key">PHASE</span>
                        <span class="meta-val" id="meta-phase">01</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="timeline-section glass-panel" id="timeline-section">
            <div class="timeline-track" id="timeline-track">
                <div class="timeline-rail">
                    <div class="timeline-fill" id="timeline-fill"></div>
                    <div class="timeline-nodes" id="timeline-nodes"></div>
                </div>
                <div class="timeline-labels" id="timeline-labels"></div>
            </div>
            <div class="timeline-scrubber" id="timeline-scrubber">
                <div class="scrubber-head" id="scrubber-head"></div>
            </div>
        </section>

        <section class="detail-grid" id="detail-grid"></section>

        <footer class="controls-bar glass-panel">
            <div class="controls-scroll">
                <div class="ctrl-group">
                    <label class="ctrl-label">配色</label>
                    <div class="theme-swatches" id="theme-swatches">
                        <button class="swatch active" data-theme="aurora" style="--swatch-1:#c4b5fd;--swatch-2:#818cf8" aria-label="极光"></button>
                        <button class="swatch" data-theme="ember" style="--swatch-1:#f97316;--swatch-2:#ef4444" aria-label="余烬"></button>
                        <button class="swatch" data-theme="ocean" style="--swatch-1:#06b6d4;--swatch-2:#3b82f6" aria-label="深海"></button>
                        <button class="swatch" data-theme="flora" style="--swatch-1:#22c55e;--swatch-2:#84cc16" aria-label="翠林"></button>
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">任务集</label>
                    <div class="mode-toggle" id="mission-toggle">
                        <button class="mode-btn active" data-set="launch" aria-label="产品发布">产品发布</button>
                        <button class="mode-btn" data-set="expedition" aria-label="远征探索">远征探索</button>
                        <button class="mode-btn" data-set="research" aria-label="研究计划">研究计划</button>
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">动画速度 <span class="ctrl-value" id="val-speed">50</span></label>
                    <input type="range" id="ctrl-speed" class="range-input" min="10" max="100" value="50">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">粒子密度 <span class="ctrl-value" id="val-density">55</span></label>
                    <input type="range" id="ctrl-density" class="range-input" min="10" max="100" value="55">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">呼吸强度 <span class="ctrl-value" id="val-breath">45</span></label>
                    <input type="range" id="ctrl-breath" class="range-input" min="0" max="100" value="45">
                </div>
            </div>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script src="main.js"></script>
</body>
</html>
