<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Nav 叠层导航 - 流体覆盖式全屏导航体验</title>
    <meta name="description" content="沉浸式叠层导航微交互。四种流体展开模式（液态形变/径向绽放/幕帘裂分/故障切片），弹簧-阻尼物理驱动的菜单动力学，粒子流场 + 微晶玻璃态容器。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-overlay="closed" data-mode="liquid">

    <!-- z:100 — 返回数字花园 -->
    <a href="../../index.html" class="back-link" aria-label="返回数字花园">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回数字花园</span>
    </a>

    <!-- z:0 — 流体网格渐变背景 -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- z:1 — 粒子流场画布 -->
    <canvas id="overlay-canvas" aria-hidden="true"></canvas>

    <!-- z:2 — 光标跟随光晕 -->
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <!-- z:10 — 微晶玻璃态主容器 -->
    <main class="app-shell" id="app-shell">

        <!-- 顶部导航条 -->
        <header class="top-nav">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                         stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="4"/>
                        <path d="M3 9h18M9 3v18"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">Overlay Nav</span>
                    <span class="brand-sub">叠层导航</span>
                </div>
            </div>

            <div class="nav-controls">
                <!-- 模式选择 -->
                <div class="mode-toggle" id="mode-toggle" role="group" aria-label="展开模式">
                    <button class="mode-btn active" data-mode="liquid" data-name="液态形变">液态</button>
                    <button class="mode-btn" data-mode="radial" data-name="径向绽放">径向</button>
                    <button class="mode-btn" data-mode="curtain" data-name="幕帘裂分">幕帘</button>
                    <button class="mode-btn" data-mode="glitch" data-name="故障切片">故障</button>
                </div>

                <!-- 氛围配色 -->
                <div class="theme-toggle" id="theme-toggle" role="group" aria-label="氛围配色">
                    <button class="theme-btn active" data-theme="obsidian" aria-label="黑曜">黑曜</button>
                    <button class="theme-btn" data-theme="halcyon" aria-label="静昼">静昼</button>
                    <button class="theme-btn" data-theme="ember" aria-label="余烬">余烬</button>
                    <button class="theme-btn" data-theme="verdant" aria-label="苍翠">苍翠</button>
                </div>

                <!-- 全屏 -->
                <button class="icon-btn" id="fullscreen-btn" aria-label="全屏">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 中心舞台 -->
        <section class="stage" id="stage">

            <!-- 左侧：当前模式信息卡 -->
            <aside class="info-panel">
                <div class="info-label">CURRENT MODE</div>
                <h2 class="info-mode" id="info-mode">液态形变</h2>
                <p class="info-desc" id="info-desc">流体形变驱动的全屏覆盖。面板从单一锚点液化蔓延展开，菜单项以弹簧节奏从液面浮现。</p>

                <div class="info-stats">
                    <div class="stat-row">
                        <span class="stat-key">缓动</span>
                        <span class="stat-val" id="stat-easing">cubic-bezier(0.16,1,0.3,1)</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-key">展开时长</span>
                        <span class="stat-val" id="stat-duration">900 ms</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-key">菜单项</span>
                        <span class="stat-val">6</span>
                    </div>
                </div>

                <div class="info-divider"></div>

                <div class="info-hint">
                    <span class="hint-key">SPACE</span>
                    <span class="hint-label">唤起叠层</span>
                </div>
                <div class="info-hint">
                    <span class="hint-key">ESC</span>
                    <span class="hint-label">收起</span>
                </div>
                <div class="info-hint">
                    <span class="hint-key">1 - 4</span>
                    <span class="hint-label">切换模式</span>
                </div>
            </aside>

            <!-- 右侧：触发器与状态环 -->
            <div class="stage-center">
                <div class="trigger-orbit" id="trigger-orbit">
                    <div class="orbit-ring orbit-ring-1"></div>
                    <div class="orbit-ring orbit-ring-2"></div>
                    <div class="orbit-ring orbit-ring-3"></div>
                    <button class="trigger-btn" id="trigger-btn" aria-label="展开导航">
                        <span class="trigger-icon" id="trigger-icon">
                            <span class="bar bar-1"></span>
                            <span class="bar bar-2"></span>
                            <span class="bar bar-3"></span>
                        </span>
                        <span class="trigger-label" id="trigger-label">展开</span>
                    </button>
                    <div class="orbit-pulse" id="orbit-pulse"></div>
                </div>

                <div class="stage-meta">
                    <div class="meta-chip" id="state-chip">CLOSED</div>
                    <div class="meta-chip" id="open-count">已展开 0 次</div>
                </div>
            </div>

        </section>

        <!-- 底部状态栏 -->
        <footer class="app-footer">
            <div class="footer-hint">
                <span class="hint-key">SPACE</span>
                <span class="hint-sep">·</span>
                <span class="hint-key">CLICK</span>
                <span class="hint-label">触发叠层</span>
            </div>
            <div class="footer-meta">
                <span class="meta-chip" id="fps-counter">60 FPS</span>
                <span class="meta-chip" id="particle-count">110 P</span>
                <span class="meta-chip">v1.0</span>
            </div>
        </footer>
    </main>

    <!-- z:40 — 叠层导航遮罩（动态构建内容） -->
    <div class="overlay-veil" id="overlay-veil" aria-hidden="true"></div>

    <!-- z:50 — 叠层导航面板 -->
    <nav class="overlay-panel" id="overlay-panel" aria-hidden="true" role="dialog" aria-modal="true" aria-label="主导航">
        <button class="overlay-close" id="overlay-close" aria-label="关闭导航">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
        </button>

        <div class="overlay-inner">
            <div class="overlay-header">
                <span class="overlay-eyebrow" id="overlay-eyebrow">NAVIGATE</span>
                <h2 class="overlay-title" id="overlay-title">去往何处</h2>
            </div>

            <ul class="overlay-menu" id="overlay-menu" role="menu">
                <!-- 菜单项由 main.js 动态构建以保证模式适配 -->
            </ul>

            <div class="overlay-footer">
                <div class="overlay-foot-block">
                    <span class="foot-label">MODE</span>
                    <span class="foot-val" id="foot-mode">液态形变</span>
                </div>
                <div class="overlay-foot-block">
                    <span class="foot-label">PALETTE</span>
                    <span class="foot-val" id="foot-palette">黑曜</span>
                </div>
                <div class="overlay-foot-block">
                    <span class="foot-label">SESSION</span>
                    <span class="foot-val" id="foot-session">#0001</span>
                </div>
            </div>
        </div>

        <!-- 装饰性边角刻度 -->
        <div class="overlay-corner corner-tl"></div>
        <div class="overlay-corner corner-tr"></div>
        <div class="overlay-corner corner-bl"></div>
        <div class="overlay-corner corner-br"></div>
    </nav>

    <!-- z:60 — Toast 通知 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="main.js"></script>
</body>
</html>
