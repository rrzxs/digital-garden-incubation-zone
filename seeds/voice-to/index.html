<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice To — 声波凝形</title>
    <meta name="description" content="沉浸式语音转文字交互体验。言语化为流体波形，文字从声波中浮现。Web Speech API + Canvas 波形可视化 + 流体粒子场">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a12'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='22' font-family='monospace' fill='%23c4b5fd'%3EV2%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <header class="panel-header glass-panel">
            <div class="brand-group">
                <h1 class="brand-title">Voice<span class="brand-dot">.</span><span class="brand-sub">To</span></h1>
                <p class="brand-subtitle">声波凝形 — 言语化为流体，文字从声波中浮现</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-clear" aria-label="清除" title="清除文字">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
                <button class="icon-btn" id="btn-copy" aria-label="复制" title="复制文字">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button class="icon-btn" id="btn-lang" aria-label="语言" title="切换语言">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </button>
            </div>
        </header>

        <section class="viz-stage" id="viz-stage">
            <div class="viz-glass">
                <canvas id="waveCanvas"></canvas>
                <div class="viz-overlay" id="viz-overlay">
                    <div class="idle-hint" id="idle-hint">
                        <div class="hint-icon-wrap">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        </div>
                        <p>点击下方按钮开始语音识别</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="transcript-area glass-panel" id="transcript-area">
            <div class="transcript-scroll" id="transcript-scroll">
                <div class="transcript-content" id="transcript-content">
                    <p class="transcript-placeholder" id="transcript-placeholder">语音识别到的文字将在这里浮现…</p>
                </div>
            </div>
            <div class="transcript-stats" id="transcript-stats">
                <span class="stat-item" id="stat-chars">0 字</span>
                <span class="stat-sep">·</span>
                <span class="stat-item" id="stat-segments">0 段</span>
                <span class="stat-sep">·</span>
                <span class="stat-item" id="stat-duration">0:00</span>
            </div>
        </section>

        <section class="controls-section">
            <div class="record-btn-wrap">
                <button class="record-btn" id="record-btn" aria-label="开始录音">
                    <div class="record-btn-ring"></div>
                    <div class="record-btn-ring record-btn-ring-2"></div>
                    <div class="record-btn-inner">
                        <svg class="mic-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        <svg class="stop-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </div>
                </button>
                <div class="record-label" id="record-label">点击开始</div>
            </div>

            <div class="palette-group" id="palette-group">
                <button class="palette-btn active" data-palette="aurora" aria-label="极光">
                    <span class="dot" style="background: linear-gradient(135deg, #667eea, #764ba2)"></span>
                </button>
                <button class="palette-btn" data-palette="ember" aria-label="余烬">
                    <span class="dot" style="background: linear-gradient(135deg, #f97316, #ef4444)"></span>
                </button>
                <button class="palette-btn" data-palette="ocean" aria-label="深海">
                    <span class="dot" style="background: linear-gradient(135deg, #06b6d4, #3b82f6)"></span>
                </button>
                <button class="palette-btn" data-palette="neon" aria-label="霓虹">
                    <span class="dot" style="background: linear-gradient(135deg, #22d3ee, #a3e635)"></span>
                </button>
            </div>
        </section>
    </div>

    <div class="toast" id="toast"></div>

    <script src="main.js"></script>
</body>
</html>
