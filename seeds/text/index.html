<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字解密 | Text Scramble</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="noise-layer"></div>
    </div>

    <main class="container">
        <header class="header">
            <div class="badge">Interactive</div>
            <h1 class="title">文字解密</h1>
            <p class="subtitle">Text Scramble Effect</p>
        </header>

        <section class="scramble-display glass-panel">
            <div class="scramble-text" id="scramble-output"></div>
            <div class="scramble-meta">
                <span class="meta-item" id="char-count">0 / 0</span>
                <span class="meta-item" id="progress-bar">
                    <span class="progress-fill" id="progress-fill"></span>
                </span>
            </div>
        </section>

        <section class="controls glass-panel">
            <div class="control-group">
                <label class="control-label">目标文字</label>
                <input type="text" class="control-input" id="target-input" 
                       placeholder="输入你想解密的文字..." 
                       value="HELLO WORLD">
            </div>

            <div class="control-row">
                <div class="control-group">
                    <label class="control-label">解密速度</label>
                    <select class="control-select" id="speed-select">
                        <option value="slow">慢速</option>
                        <option value="normal" selected>正常</option>
                        <option value="fast">快速</option>
                        <option value="instant">瞬间</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">字符集</label>
                    <select class="control-select" id="charset-select">
                        <option value="hex">十六进制</option>
                        <option value="binary">二进制</option>
                        <option value="symbols" selected>符号</option>
                        <option value="letters">字母</option>
                        <option value="numbers">数字</option>
                    </select>
                </div>
            </div>

            <div class="control-row">
                <button class="btn btn-primary" id="start-btn">
                    <span class="btn-text">开始解密</span>
                    <span class="btn-icon">▶</span>
                </button>
                <button class="btn btn-secondary" id="reset-btn">
                    <span class="btn-text">重置</span>
                </button>
                <button class="btn btn-ghost" id="random-btn">
                    <span class="btn-text">随机</span>
                </button>
            </div>
        </section>

        <section class="presets glass-panel">
            <h3 class="presets-title">预设文字</h3>
            <div class="preset-grid" id="preset-grid"></div>
        </section>

        <section class="mode-toggle">
            <button class="mode-btn active" data-mode="single">单次解密</button>
            <button class="mode-btn" data-mode="loop">循环播放</button>
            <button class="mode-btn" data-mode="cascade">级联效果</button>
        </section>
    </main>

    <div class="cursor-glow" id="cursor-glow"></div>

    <script src="main.js"></script>
</body>
</html>
