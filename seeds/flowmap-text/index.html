<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowMap Text — 流场文字</title>
    <meta name="description" content="沉浸式流场文字交互体验。输入文字，观察字符在 Simplex 噪声流场中流动、旋转、响应鼠标力场">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a12'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='26' font-family='monospace' fill='%23c4b5fd'%3EFm%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <a href="../../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回花园</span>
    </a>

    <div class="app-shell">
        <header class="panel-header glass-panel">
            <div class="brand-group">
                <h1 class="brand-title">Flow<span class="brand-dot">.</span>Map<span class="brand-sep">/</span>Text</h1>
                <p class="brand-subtitle">流场文字实验室 — Simplex 噪声驱动的字符流体场</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-shuffle" aria-label="随机化" title="随机化">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="icon-btn" id="btn-reset" aria-label="重置" title="重置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
            </div>
        </header>

        <section class="stage" id="stage">
            <canvas class="flow-canvas" id="flow-canvas"></canvas>
            <div class="stage-overlay" id="stage-overlay">
                <div class="flow-hint" id="flow-hint">移动鼠标扰动流场</div>
            </div>
        </section>

        <footer class="controls-bar glass-panel">
            <div class="controls-scroll">
                <div class="ctrl-group">
                    <label class="ctrl-label">输入文字</label>
                    <div class="text-input-wrap">
                        <input type="text" id="input-text" class="text-input" value="FLOW MAP" maxlength="50" placeholder="输入任意文字...">
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">字号 <span class="ctrl-value" id="val-size">28</span></label>
                    <input type="range" id="ctrl-size" class="range-input" min="12" max="72" value="28">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">流速 <span class="ctrl-value" id="val-speed">45</span></label>
                    <input type="range" id="ctrl-speed" class="range-input" min="0" max="100" value="45">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">噪声尺度 <span class="ctrl-value" id="val-scale">50</span></label>
                    <input type="range" id="ctrl-scale" class="range-input" min="10" max="100" value="50">
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">力场强度 <span class="ctrl-value" id="val-force">60</span></label>
                    <input type="range" id="ctrl-force" class="range-input" min="0" max="100" value="60">
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">流场模式</label>
                    <div class="mode-toggle" id="mode-toggle">
                        <button class="mode-btn active" data-mode="perlin" aria-label="柏林流">Perlin</button>
                        <button class="mode-btn" data-mode="curl" aria-label="旋度场">Curl</button>
                        <button class="mode-btn" data-mode="vortex" aria-label="涡旋场">Vortex</button>
                        <button class="mode-btn" data-mode="turbulence" aria-label="湍流">Turbulence</button>
                    </div>
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">力场交互</label>
                    <div class="mode-toggle" id="force-toggle">
                        <button class="mode-btn active" data-force="attract" aria-label="吸引">Attract</button>
                        <button class="mode-btn" data-force="repel" aria-label="排斥">Repel</button>
                        <button class="mode-btn" data-force="swirl" aria-label="漩涡">Swirl</button>
                    </div>
                </div>

                <div class="ctrl-divider"></div>

                <div class="ctrl-group">
                    <label class="ctrl-label">轨迹</label>
                    <div class="mode-toggle" id="trail-toggle">
                        <button class="mode-btn active" data-trail="fade" aria-label="渐隐">Fade</button>
                        <button class="mode-btn" data-trail="persist" aria-label="持久">Persist</button>
                        <button class="mode-btn" data-trail="none" aria-label="无">None</button>
                    </div>
                </div>

                <div class="ctrl-group">
                    <label class="ctrl-label">氛围配色</label>
                    <div class="palette-toggle" id="palette-toggle">
                        <button class="palette-btn active" data-palette="aurora" aria-label="极光">
                            <span class="swatch" style="background: linear-gradient(135deg, #c4b5fd, #67e8f9)"></span>
                        </button>
                        <button class="palette-btn" data-palette="ember" aria-label="烬火">
                            <span class="swatch" style="background: linear-gradient(135deg, #fda4af, #fdba74)"></span>
                        </button>
                        <button class="palette-btn" data-palette="forest" aria-label="森林">
                            <span class="swatch" style="background: linear-gradient(135deg, #86efac, #67e8f9)"></span>
                        </button>
                        <button class="palette-btn" data-palette="void" aria-label="虚空">
                            <span class="swatch" style="background: linear-gradient(135deg, #94a3b8, #e2e8f0)"></span>
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
